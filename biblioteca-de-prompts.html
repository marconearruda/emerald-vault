44. IMAGEM DO AUTOR — REGRA OBRIGATÓRIA
============================================================
Quando houver espaço para apresentação do autor: o arquivo deverá estar preparado para PNG 512 × 512 px. Nome sugerido: assets/autor.png. Utilize 1:1; 512×512; object-fit: cover ou contain conforme a imagem; borda/radius coerente; alt adequado.

Não invente foto de autor. Se não houver imagem real: utilize slot funcional.

============================================================
45. MOCKUPS
============================================================
Quando apropriado, crie mockup de e-book; mockup de smartphone; mockup de tablet; composição editorial; página interna; ferramenta visual. Não invente páginas ou conteúdo inexistentes.

============================================================
46. IMPRESSÃO DO E-BOOK / BÔNUS
============================================================
A impressão deverá preservar A TOTALIDADE DOS EFEITOS VISUAIS RELEVANTES DO PROJETO, sempre que tecnicamente possível. Isso inclui, quando apropriado: gradientes; bordas; sombras; blocos; destaques; cores; hierarquia; composição; molduras; elementos gráficos; imagens; tipografia; paginação; cabeçalho; rodapé. Utilize CSS de impressão avançado. Não simplifique automaticamente a página para uma folha branca sem identidade visual.

============================================================
47. PRINT CSS — REGRA CRÍTICA
============================================================
Implemente @page { size: A4; margin: 0; }. Cada página deverá respeitar width: 21cm; height: 29.7cm. Área interna: 17cm × 25cm.

Preserve, quando possível: print-color-adjust: exact; -webkit-print-color-adjust: exact. Use break-before; break-after; break-inside; page-break-before; page-break-after; page-break-inside conforme necessário.

============================================================
48. BOTÃO IMPRIMIR
============================================================
Inclua IMPRIMIR. Ao clicar: window.print(). Durante a impressão: ocultar controles; ocultar botões; ocultar elementos interativos não necessários; preservar páginas; preservar efeitos visuais; preservar imagens; preservar numeração; preservar cabeçalho/rodapé.

============================================================
49. EXPORTAÇÃO PARA PDF
============================================================
Inclua EXPORTAR PDF. Priorize uma solução tecnicamente honesta. Quando necessário: chamar window.print(); abrir diálogo de impressão; orientar implicitamente o navegador para salvar como PDF; preservar A4; preservar paginação; preservar gráficos.

Não diga que gera PDF binário automaticamente se o navegador não possuir essa capacidade nativa. Caso seja tecnicamente viável utilizar biblioteca leve e estável, poderá fazê-lo, mas sem tornar o sistema excessivamente pesado.

============================================================
50. EXPORTAÇÃO PROFISSIONAL PARA EPUB — REGRA DIAMOND
============================================================
Esta é uma das regras mais importantes de todo o prompt. Inclua EXPORTAR PARA EPUB. A exportação deverá buscar um EPUB 3 profissional e estruturalmente válido, e não simplesmente salvar o HTML com outra extensão.

============================================================
51. O EPUB DEVERÁ POSSUIR
============================================================
Quando exportado, o arquivo EPUB deverá procurar conter, quando tecnicamente aplicável: mimetype; META-INF/container.xml; OEBPS/content.opf; OEBPS/nav.xhtml; XHTMLs do conteúdo; CSS próprio; imagens; metadata; identificação do autor; título; idioma; ordem de leitura; manifest; spine; links funcionais; referências internas; referências externas; navegação; capa; recursos gráficos.

============================================================
52. PAGINAÇÃO DO EPUB
============================================================
A equipe deverá escolher tecnicamente entre EPUB 3 REFLOWABLE quando o conteúdo se beneficiar de adaptação de tamanho de tela, fonte e orientação; OU EPUB 3 FIXED-LAYOUT quando a preservação visual da composição original for essencial.

A escolha deverá ser feita com base no conteúdo real. Não transforme automaticamente um e-book editorial A4 em um EPUB inadequado.

============================================================
53. REQUISITOS DE DIMENSIONAMENTO DO EPUB
============================================================
Se for utilizado EPUB Fixed Layout: defina corretamente viewport; dimensões; orientação; proporção; páginas; layout; links; recursos; ordem de leitura.

Se for utilizado EPUB Reflowable: adapte tipografia; espaçamento; largura; tamanho de imagens; headings; tabelas; caixas; links. Sem destruir a identidade editorial.

============================================================
54. LINKS NO EPUB
============================================================
Links internos deverão continuar funcionais. Exemplo: sumário → capítulo; capítulo → ferramenta; capítulo → bônus. Links externos deverão continuar funcionais quando o leitor EPUB permitir. Não transforme links em texto morto.

============================================================
55. IMAGENS NO EPUB
============================================================
Inclua corretamente as imagens realmente utilizadas. Garanta caminho válido; MIME correto; presença no manifest; referência correta; proporção; resolução adequada; alt/semântica quando aplicável. Não inclua imagens que não existem.

============================================================
56. CAPA DO EPUB
============================================================
Quando existir uma capa real: utilize-a. Quando não existir: crie estrutura compatível com o visual do bônus ou utilize placeholder funcional. Não invente uma capa que contradiga o produto.

============================================================
57. TECNOLOGIA PARA EXPORTAÇÃO EPUB
============================================================
Como HTML + JavaScript puro não possuem, por si só, uma API nativa para gerar arquivos ZIP/EPUB complexos, você poderá utilizar uma biblioteca pública, leve e compatível com navegador, quando necessário. Por exemplo, uma biblioteca de compactação ZIP apropriada.

Porém não utilize bibliotecas desnecessárias; não carregue dezenas de dependências; mantenha a funcionalidade organizada; não exija backend; não exija Node; não exija build. Caso uma biblioteca seja utilizada, ela deverá ser carregada de fonte pública e estável, compatível com GitHub Pages.

============================================================
58. EXPORTAÇÃO EPUB — EXPERIÊNCIA DO USUÁRIO
============================================================
O botão EXPORTAR EPUB deverá: 1. preparar o conteúdo; 2. construir o pacote; 3. inserir metadata; 4. inserir CSS; 5. inserir XHTML; 6. inserir imagens; 7. inserir navegação; 8. montar manifest; 9. montar spine; 10. gerar arquivo; 11. iniciar download; 12. utilizar nome de arquivo adequado.

Exemplo: bonus-1-[slug].epub.

============================================================
59. REGRA DE INTEGRIDADE DO EPUB
============================================================
Antes de finalizar a implementação verifique conceitualmente: mimetype correto; estrutura de container correta; OPF coerente; manifest completo; spine correto; nav correto; XHTML válido; referências existentes; imagens referenciadas; CSS referenciado; links preservados; metadata coerente.

Não entregue simplesmente um .zip renomeado para .epub sem estrutura apropriada.

============================================================
60. INTERAÇÃO DO BÔNUS
============================================================
Cada bônus deverá utilizar JavaScript para melhorar a experiência quando fizer sentido. Pode implementar checklist persistente; diagnóstico; contador interno; progresso; tabs; accordion; calculadora; campos; geração de resultado; copiar para clipboard; salvar; reset; impressão; exportação; filtros; navegação. Não crie interações sem função.

============================================================
61. PERSISTÊNCIA LOCAL
============================================================
Quando um bônus possuir checklist; formulário; planejamento; diagnóstico; pontuação; progresso; considere utilizar localStorage para preservar dados no dispositivo. Não utilize servidor.

============================================================
62. FUNCIONALIDADE OFFLINE
============================================================
Sempre que possível, o bônus deverá funcionar localmente depois de carregado, sem depender de backend. Se forem utilizadas dependências externas: a equipe deverá considerar fallback quando tecnicamente possível.

============================================================
63. ACESSIBILIDADE
============================================================
Cada bônus deverá implementar HTML semântico; hierarquia correta; contraste; foco visível; teclado; labels; aria-label; aria-expanded; aria-controls; role; alt text; reduced motion; botões verdadeiramente clicáveis.

============================================================
64. RESPONSIVIDADE
============================================================
Teste conceitualmente 320px; 375px; 390px; 414px; 768px; 1024px; 1280px; 1440px; 1920px. Garanta nenhuma rolagem horizontal; páginas A4 proporcionais; ferramentas adaptadas; botões acessíveis; textos legíveis; imagens proporcionais; slots 9:16 funcionando; avatar adaptado; modal adequado; toolbar adaptada.

============================================================
65. PERFORMANCE
============================================================
Priorize CSS eficiente; JavaScript enxuto; lazy loading; imagens otimizadas; poucas fontes; poucas dependências; animações com transform/opacity; carregamento sob demanda; DOM organizado.

============================================================
66. GITHUB PAGES
============================================================
Cada bônus deverá funcionar como bonus-1.html; bonus-2.html; bonus-3.html; bonus-4.html; bonus-5.html em GitHub Pages. Não dependa de Node; npm; backend; PHP; banco; servidor próprio; processo de build.

============================================================
67. ARQUITETURA DE ARQUIVOS
============================================================
A entrega final da sequência deverá resultar em bonus-1.html; bonus-2.html; bonus-3.html; bonus-4.html; bonus-5.html. Cada arquivo deverá ser autocontido. Cada um deverá possuir html; head (metadata + CSS); body (conteúdo completo + interface + componentes + script JavaScript).

============================================================
68. NÃO CRIAR CSS OU JS SEPARADOS
============================================================
Não crie styles.css; script.js; app.js; components.js; arquivos JavaScript auxiliares; arquivos CSS auxiliares. Tudo deverá estar dentro do próprio bônus HTML.

============================================================
69. NAMESPACE
============================================================
Cada bônus deverá possuir classes próprias e preferencialmente namespace. Exemplo: .bonus-page; .bonus-page__cover; .bonus-page__toolbar; .bonus-page__page; .bonus-page__tool; .bonus-page__footer. Evite CSS global que possa causar conflitos.

============================================================
70. ESTRUTURA DE CONFIGURAÇÃO
============================================================
Centralize as principais configurações no JavaScript. Exemplo conceitual: const BONUS_CONFIG = { title: "", author: "", totalPages: 0, social: { facebook: "", instagram: "", youtube: "" }, assets: { author: "assets/autor.png" }, ebookLinks: [], affiliateProducts: [], epub: { enabled: true, mode: "auto" } }; Adapte conforme os dados reais.

============================================================
71. IMAGENS E ASSETS NO CÓDIGO
============================================================
O código deverá deixar extremamente claro onde substituir capa; imagem principal; screenshots; imagens internas; autor; ícones; outras mídias. Use caminhos relativos.

============================================================
72. REGRAS DE PLACEHOLDER
============================================================
Quando um arquivo real não estiver disponível: não remova a estrutura. Crie um placeholder editorial funcional contendo nome esperado; extensão; finalidade; proporção; localização.

Exemplo: IMAGEM: bonus-1-print-01.webp; FORMATO: WEBP; PROPORÇÃO: 9:16; FUNÇÃO: screenshot da ferramenta; LOCAL: página 4. Não use caixas vazias visualmente pobres.

============================================================
73. NÃO INVENTAR ATIVOS
============================================================
Nunca apresente como real: foto inventada; screenshot inventado; resultado inventado; logo inventado; depoimento inventado; interface falsa; cliente fictício tratado como cliente real; número fictício tratado como real. Quando precisar demonstrar visualmente: identifique como EXEMPLO ou DEMONSTRAÇÃO.

============================================================
74. PROVA SOCIAL
============================================================
Os bônus não deverão inventar depoimentos. Se o e-book principal possuir depoimentos reais e houver motivo editorial para utilizá-los, preserve sua natureza. Se não houver: não crie.

============================================================
75. DADOS E EXEMPLOS
============================================================
Você poderá criar exemplos didáticos quando necessários para ensinar uma ferramenta, desde que fique claro que são exemplos. Exemplo: "Considere uma empresa hipotética…". Não transforme o exemplo em caso real.

============================================================
76. CONEXÕES COM OS INFOPRODUTOS
============================================================
Nos pontos adequados, os bônus poderão apresentar "Quer aprofundar esta etapa?" ou "Este material ajuda com a etapa complementar…". Depois: produto correspondente; benefício; CTA; hotlink real. A conexão deverá ser discreta.

============================================================
77. QUANTIDADE DE CTAs
============================================================
Não coloque CTA após cada página. A quantidade deverá ser determinada pela função do bônus. O bônus precisa parecer MATERIAL ÚTIL e não CATÁLOGO DE AFILIADOS.

============================================================
78. CONTINUIDADE VISUAL
============================================================
Os cinco bônus devem parecer parte do mesmo ecossistema. Devem compartilhar linguagem; tipografia; lógica; qualidade; paginação; toolbar; experiência; elementos de navegação. Mas cada bônus deverá possuir identidade própria suficiente para ser distinguível.

============================================================
79. DIFERENCIAÇÃO ENTRE OS CINCO BÔNUS
============================================================
Evite que o leitor pense "É o mesmo PDF com outro nome.". Cada bônus deverá possuir função diferente; experiência diferente; conteúdo específico; mecanismo específico; finalidade específica.

============================================================
80. RELAÇÃO COM A PERSONA
============================================================
Cada bônus deve atender uma dor ou desejo relevante da persona. Pergunte internamente: "Qual situação concreta da persona este bônus melhora?"; "O que ela conseguirá fazer depois de usar este bônus?"; "Por que ela guardaria este material?"; "Por que ela compartilharia?"; "Por que esse recurso seria útil mesmo sem comprar os produtos afiliados?". Se não houver resposta convincente: reformule o bônus.

============================================================
81. POTENCIAL DE ANÚNCIO
============================================================
Cada bônus deve poder ser apresentado futuramente em anúncios como "Baixe gratuitamente…", "Receba o checklist…", "Use esta ferramenta…", "Aplique este método…" sem depender de promessas exageradas. O material deve entregar a utilidade anunciada.

============================================================
82. POTENCIAL DE CAPTURA
============================================================
Cada bônus deve poder funcionar como lead magnet. Portanto, considere título específico; benefício imediato; aplicação rápida; ferramenta concreta; resultado verificável pelo próprio usuário; baixa fricção; boa percepção de valor.

============================================================
83. REGRA DE ORIGINALIDADE
============================================================
Use os materiais para compreender mercado; persona; linguagem; dores; mecanismos; contexto; posicionamento; produtos. Mas não copie textos extensos; páginas de vendas; capítulos; slogans proprietários; depoimentos; conteúdo protegido de terceiros; estruturas criativas específicas de maneira servil.

O bônus deve ser editorialmente original, ainda que coerente com o universo pesquisado.

============================================================
84. PROFUNDIDADE
============================================================
Para cada conceito importante: CONCEITO → contexto → por que importa → como aplicar → exemplo → erro comum → ação. Não transforme todos os bônus em listas superficiais.

============================================================
85. QUANDO CRIAR FRAMEWORKS
============================================================
Utilize frameworks quando eles realmente simplificarem a aplicação. Pode incluir matriz; mapa; sequência; checklist; árvore de decisão; score; protocolo; roteiro; sistema de etapas.

============================================================
86. FERRAMENTAS INTERATIVAS
============================================================
Quando apropriado, converta o conteúdo em ferramenta. Exemplos: Checklist (marcadores persistentes); Diagnóstico (perguntas + pontuação + resultado); Planejamento (campos + etapas + acompanhamento); Calculadora (entradas + cálculo + interpretação); Gerador (inputs + resultado copiável); Matriz (seleção + classificação); Workbook (campos preenchíveis + progresso).

============================================================
87. INTERPRETAÇÃO DOS RESULTADOS
============================================================
Quando existir pontuação ou diagnóstico: não apresente resultados como diagnóstico profissional, médico, jurídico, psicológico ou qualquer outra conclusão técnica de alto risco sem base apropriada. Quando o tema exigir: apresente como indicador educativo / ferramenta orientativa / autoavaliação.

============================================================
88. IMPRESSÃO DAS FERRAMENTAS
============================================================
Ferramentas preenchíveis deverão continuar úteis quando impressas. Checklists: ☐ item. Campos: ________________________________. Tabelas: deverão caber na área útil.

============================================================
89. EXPORTAÇÃO DO CONTEÚDO PREENCHIDO
============================================================
Quando fizer sentido, o bônus poderá permitir copiar resultado; imprimir resultado; exportar o estado atual; salvar localmente. Não invente envio para servidor.

============================================================
90. METADADOS
============================================================
Cada bônus deverá possuir <title>; meta description; viewport; idioma; autor quando conhecido; Open Graph quando pertinente; descrição.

============================================================
91. AUTOR
============================================================
Se o nome do autor estiver disponível: utilize-o. Se não estiver: não invente. A imagem, quando disponível, deverá apontar para assets/autor.png com 512 × 512 px.

============================================================
92. REDES SOCIAIS
============================================================
Quando houver dados reais: inclua Facebook; Instagram; YouTube. Use os respectivos arquivos: facebook.webp; instagram.webp; youtube.webp. Não altere os arquivos para SVG ou PNG se a instrução exigir WebP.

============================================================
93. SEGURANÇA DOS LINKS
============================================================
Quando abrir links externos em nova aba: utilize quando apropriado target="_blank" rel="noopener noreferrer".

============================================================
94. AUDITORIA DOS LINKS
============================================================
Antes de cada entrega, confirme URL correta; produto correto; CTA correto; ausência de href fictício; ausência de # inadequado; parâmetros preservados; redes sociais corretas; links internos funcionando; links do EPUB preservados.

============================================================
95. AUDITORIA DOS ASSETS
============================================================
Confirme autor → PNG 512×512; Facebook → WEBP; Instagram → WEBP; YouTube → WEBP; screenshots 9:16 quando aplicável; demais imagens com extensão apropriada; caminhos relativos; nomes consistentes; referências corretas.

============================================================
96. AUDITORIA DE PAGINAÇÃO
============================================================
Para cada bônus confirme A4; 21 × 29,7 cm; área 17 × 25 cm; conteúdo dentro da área; cabeçalho; rodapé; numeração; ausência de overflow; ausência de cortes; imagens corretas; tabelas corretas; boxes corretos.

============================================================
97. AUDITORIA DE VOLUME
============================================================
Confirme PÁGINAS DO BÔNUS ≤ PÁGINAS DO E-BOOK PRINCIPAL para todos os cinco bônus. Não permita nenhuma exceção.

============================================================
98. AUDITORIA DE COMPLEMENTARIDADE
============================================================
Para cada bônus pergunte: Qual dor resolve? Qual parte do e-book complementa? Que ação permite executar? O que acrescenta que não está simplesmente repetindo? Pode ser usado isoladamente? Tem utilidade real? Possui valor como brinde? É adequado à persona? Tem relação legítima com os infoprodutos?

============================================================
99. AUDITORIA DE NÃO REDUNDÂNCIA
============================================================
Antes de criar o bônus seguinte, compare-o com todos os anteriores. Não permita repetição estrutural excessiva; mesma ferramenta com nome diferente; mesmo checklist; mesma promessa; mesma função; mesmo conteúdo reciclado. Os cinco bônus devem funcionar como um KIT COMPLETO.

============================================================
100. AUDITORIA DE EXPERIÊNCIA
============================================================
Pergunte "Eu usaria isso?"; "Eu salvaria isso?"; "Eu imprimiria isso?"; "Eu recomendaria isso?"; "Isso resolve alguma coisa de verdade?"; "O visual transmite qualidade?"; "O conteúdo é suficientemente útil?". Se não: refine.

============================================================
101. AUDITORIA TÉCNICA DO EPUB
============================================================
Para cada bônus confirme EPUB 3; pacote ZIP estruturado corretamente; mimetype; container.xml; content.opf; nav.xhtml; CSS; XHTML; imagens; metadata; spine; manifest; links; capa; ordem de leitura.

============================================================
102. AUDITORIA DE IMPRESSÃO
============================================================
Simule mentalmente Ctrl + P → A4 → escala adequada → preservar gráficos → preservar paginação → preservar efeitos. A página impressa deve parecer um documento profissional.

============================================================
103. AUDITORIA MOBILE
============================================================
Confirme toolbar não domina a tela; páginas proporcionais; texto legível; imagens corretas; screenshots 9:16; controles tocáveis; tabelas adaptadas; ferramentas utilizáveis.

============================================================
104. AUDITORIA DE ACESSIBILIDADE
============================================================
Confirme teclado; foco; contraste; labels; ARIA; alt; headings; reduced motion; leitores de tela; botões; formulários.

============================================================
105. AUDITORIA DE PERFORMANCE
============================================================
Confirme ausência de scripts excessivos; bibliotecas gigantes; imagens desnecessárias; dezenas de fontes; animações pesadas; carregamentos automáticos inúteis.

============================================================
106. ESTRATÉGIA DOS CINCO BÔNUS
============================================================
Antes da primeira entrega, crie internamente uma matriz: BÔNUS 1 (Nome; Função; Dor; Solução; Formato; Páginas; Relação com e-book; Relação com infoprodutos). BÔNUS 2... BÔNUS 5...

Não entregue essa matriz ao usuário. Ela serve para garantir coerência interna.

============================================================
107. NOMENCLATURA DOS ARQUIVOS
============================================================
Use bonus-1.html; bonus-2.html; bonus-3.html; bonus-4.html; bonus-5.html. Quando apropriado, o título interno de cada bônus deverá ser comercial/editorialmente adequado.

============================================================
108. ORDEM DOS BÔNUS
============================================================
A ordem deverá ser estrategicamente escolhida. Não necessariamente Bônus 1 = mais simples. Pode ser diagnóstico → execução → otimização → ferramenta → consolidação ou outra sequência adequada. A ordem deve fazer sentido como coleção.

============================================================
109. ETAPA 1 — ENTREGA DO BÔNUS 1
============================================================
Na primeira resposta após analisar completamente os materiais: entregue SOMENTE O BÔNUS 1. Arquivo: bonus-1.html. O arquivo deverá ser completo. Não entregue bonus-2; bonus-3; bonus-4; bonus-5.

Após o código completo do Bônus 1, faça uma única pergunta: "Posso continuar para a Etapa 2 e gerar o Bônus 2?"

============================================================
110. ETAPA 2 — ENTREGA DO BÔNUS 2
============================================================
Somente depois que o usuário autorizar: entregue exclusivamente bonus-2.html. Depois pergunte "Posso continuar para a Etapa 3 e gerar o Bônus 3?"

============================================================
111. ETAPA 3 — ENTREGA DO BÔNUS 3
============================================================
Somente depois da autorização: entregue bonus-3.html. Depois pergunte "Posso continuar para a Etapa 4 e gerar o Bônus 4?"

============================================================
112. ETAPA 4 — ENTREGA DO BÔNUS 4
============================================================
Somente depois da autorização: entregue bonus-4.html. Depois pergunte "Posso continuar para a Etapa 5 e gerar o Bônus 5?"

============================================================
113. ETAPA 5 — ENTREGA DO BÔNUS 5
============================================================
Somente depois da autorização: entregue bonus-5.html. Depois informe de maneira extremamente breve que os cinco bônus foram concluídos.

============================================================
114. REGRA CRÍTICA DE CONTINUIDADE
============================================================
Ao final de cada etapa: NÃO reinicie o projeto. NÃO reanalise os materiais como se fosse uma nova tarefa. NÃO altere os bônus anteriores sem autorização.

Mantenha internamente blueprint dos 5 bônus; identidade visual; arquitetura; quantidade planejada de páginas; relações; links; ativos; decisões editoriais. A autorização para continuar significa: prossiga com o próximo bônus mantendo todas as decisões estruturais anteriores.

============================================================
115. REGRA CRÍTICA DE LIMITE DE TOKEN
============================================================
O motivo da divisão em cinco etapas é evitar limitações técnicas de comprimento. Portanto: NUNCA entregue dois bônus na mesma etapa. NUNCA tente antecipar os próximos bônus. NUNCA compacte cinco arquivos em um único HTML. Cada etapa: 1 RESPOSTA = 1 BÔNUS HTML.

============================================================
116. NÃO ECONOMIZE CÓDIGO À CUSTA DA FUNCIONALIDADE
============================================================
O limite de resposta não deve resultar em código incompleto; JS truncado; CSS parcial; EPUB simplificado demais; ferramentas desativadas; placeholders quebrados. Cada bônus deve estar completo em sua etapa.

============================================================
117. NÃO REPETIR ANÁLISE NA RESPOSTA
============================================================
Não entregue diagnóstico; planejamento; explicação teórica; justificativa das escolhas; relatório. Faça essas análises internamente. O usuário deseja os arquivos.

============================================================
118. FORMATO DA ENTREGA DE CADA ETAPA
============================================================
A resposta de cada etapa deverá conter: 1. o código HTML completo do bônus correspondente; 2. uma única pergunta de continuação ao final. Não inclua outra explicação.

============================================================
119. REGRA SOBRE MARKDOWN
============================================================
Não envolva o HTML em explicações. Não escreva "Aqui está o bônus…". Não escreva "Neste bônus eu implementei…". Entregue diretamente o código completo. Depois do código, faça somente a pergunta de continuação correspondente.

============================================================
120. REGRA DE QUALIDADE ABSOLUTA
============================================================
Não entregue bônus que pareçam PDFs genéricos convertidos para HTML; páginas de blog; checklists pobres; templates vazios; listas de dicas; conteúdo reciclado; miniaturas do e-book. Crie PRODUTOS DIGITAIS COMPLEMENTARES.

============================================================
121. REGRA DE COERÊNCIA COM O E-BOOK
============================================================
Os bônus deverão parecer ter sido criados pelo mesmo autor/equipe do e-book principal. Devem compartilhar linguagem; raciocínio; conceitos; estética; método; abordagem; padrão de qualidade.

============================================================
122. REGRA DE VALOR
============================================================
Cada bônus precisa possuir pelo menos uma destas características: resolve uma dor; economiza tempo; reduz erros; organiza informação; facilita decisão; orienta execução; estrutura uma rotina; acompanha progresso; ajuda a implementar; transforma conteúdo em ação. Quanto mais dessas características existirem naturalmente, melhor.

============================================================
123. REGRA DE INDEPENDÊNCIA COMERCIAL
============================================================
O bônus deverá possuir utilidade mesmo que o usuário não compre nenhum infoproduto afiliado; não clique em nenhum hotlink; não continue para outra oferta. O valor do bônus deve existir por si só.

============================================================
124. REGRA DE PROMOÇÃO DOS INFOPRODUTOS
============================================================
Os infoprodutos de referência poderão aparecer estrategicamente. Porém: conteúdo primeiro. Promoção depois. A conexão deverá parecer recomendação editorial.

============================================================
125. REGRA DE NÃO REDUNDÂNCIA COM O E-BOOK
============================================================
Não copie capítulos completos. Não reproduza grandes partes do e-book. Não transforme o bônus em versão duplicada. Use pequenas referências, quando necessárias, para estabelecer conexão. O bônus deverá avançar o leitor.

============================================================
126. REGRA DE "PRÓXIMA AÇÃO"
============================================================
Sempre que fizer sentido, o final de cada bônus deverá orientar "Agora faça…" ou "Próximo passo…" ou "Use este resultado para…". Essa próxima ação deve conectar naturalmente com o e-book; outro bônus; aplicação prática; infoproduto complementar. Sem transformar isso em publicidade obrigatória.

============================================================
127. SISTEMA DE NAVEGAÇÃO ENTRE BÔNUS
============================================================
Quando fizer sentido, prepare espaço para navegação: voltar ao e-book; voltar ao início; próximo bônus; bônus anterior. Mas não crie links para arquivos inexistentes. Se desejar preparar estrutura futura: utilize configuração centralizada.

============================================================
128. REGRA DE IMAGENS NO EPUB
============================================================
As imagens utilizadas na versão HTML também deverão ser consideradas na exportação EPUB. Não gere um EPUB que omita imagens; quebre caminhos; perca capa; perca autor; perca gráficos; perca links.

============================================================
129. REGRA DE EFEITOS VISUAIS NO EPUB
============================================================
Reconheça que determinados efeitos de CSS/HTML do navegador podem não ser suportados por todos os leitores EPUB. Por isso preserve prioritariamente hierarquia; composição; cores; boxes; imagens; tipografia; espaçamento; links. Quando um efeito não puder ser reproduzido com segurança no EPUB: converta-o em uma alternativa editorial equivalente, sem comprometer leitura.

============================================================
130. REGRA DE EFEITOS NA IMPRESSÃO
============================================================
Ao contrário do EPUB, na impressão deverão ser preservados, tanto quanto possível: efeitos; cores; gradientes; sombras; bordas; composição; elementos gráficos. Não remova efeitos apenas para "simplificar".

============================================================
131. REGRA DE DIFERENCIAÇÃO ENTRE HTML, PDF E EPUB
============================================================
Entenda que existem três experiências diferentes: HTML (Interativo, responsivo e navegável); PDF (Paginado, visual e orientado à impressão); EPUB (Livro digital distribuível, estruturado segundo as limitações e capacidades do formato). Não trate os três como o mesmo arquivo com extensões diferentes.

============================================================
132. SEO
============================================================
Inclua title; description; viewport; idioma; headings; metadata; Open Graph quando apropriado.

============================================================
133. PERFORMANCE
============================================================
Use HTML semântico; CSS organizado; JS modular; poucos assets; lazy loading; dependências mínimas.

============================================================
134. TESTE FINAL DO BÔNUS
============================================================
Antes de entregar cada etapa, teste mentalmente: CONTEÚDO (É útil? É complementar? Não duplica o e-book? Atende uma dor real? Pode ser usado isoladamente?); EDITORIAL (Parece profissional? Possui começo, desenvolvimento e conclusão? Possui instruções? Possui ação?); VISUAL (Está coerente? Parece premium? Tem boa hierarquia? Imagens funcionam? Slots estão preparados?); FUNCIONAL (Botões funcionam? Pesquisa funciona? Progresso funciona? Ferramentas funcionam? Impressão funciona? PDF funciona? EPUB funciona?); PÁGINAS (A4? 17×25 cm? Sem overflow? Numeradas? Nenhum bônus excede o e-book principal?); LINKS (Reais? Corretos? Funcionais?).

============================================================
135. AUDITORIA DOS CINCO BÔNUS COMO CONJUNTO
============================================================
Antes da Etapa 1, planeje internamente os cinco. Antes da Etapa 2, compare o Bônus 2 com o Bônus 1. Antes da Etapa 3, compare com os anteriores. Antes da Etapa 4, compare com os anteriores. Antes da Etapa 5, compare com todos.

Confirme nenhuma duplicação relevante; progressão coerente; complementaridade; identidade consistente; variedade de formatos; utilidade; adequação à persona.

============================================================
136. REGRA DE FLEXIBILIDADE
============================================================
Você está autorizado a tomar decisões editoriais, visuais e estruturais. Não siga mecanicamente número fixo de páginas; tipo fixo de bônus; número fixo de ferramentas; quantidade fixa de CTAs; layout idêntico. A equipe deverá escolher a melhor solução baseada nos materiais reais.

============================================================
137. REGRA DE PRESERVAÇÃO DO DNA DO PRODUTO
============================================================
O e-book principal possui um "DNA". Esse DNA inclui problema; promessa; método; linguagem; visão; estrutura; estética; abordagem; transformação. Os cinco bônus deverão preservar esse DNA.

============================================================
138. REGRA DE EVOLUÇÃO
============================================================
Os bônus devem fazer o leitor pensar "Agora eu consigo aplicar." e não apenas "Agora eu sei mais.". O objetivo principal é CONVERTER CONHECIMENTO EM AÇÃO.

============================================================
139. REGRA DE ENTREGA COMPLETA
============================================================
Cada bônus entregue deve ser totalmente autônomo. Não diga "Na próxima etapa completarei…". O bônus atual precisa estar terminado.

============================================================
140. REGRA FINAL DE EXCELÊNCIA
============================================================
Pense como uma equipe que está criando UM E-BOOK PRINCIPAL + UM KIT DE 5 FERRAMENTAS COMPLEMENTARES + UMA EXPERIÊNCIA DIGITAL PREMIUM + UM CONJUNTO DE LEAD MAGNETS + UMA EXTENSÃO NATURAL DO ECOSSISTEMA COMERCIAL.

141. REGRA CENTRAL

NÃO CRIE CINCO "BÔNUS". Crie CINCO SOLUÇÕES DIGITAIS COMPLEMENTARES. Cada uma deverá possuir uma razão clara para existir. Cada uma deverá resolver uma necessidade diferente. Cada uma deverá possuir identidade editorial própria. Cada uma deverá possuir funcionamento próprio. Cada uma deverá possuir valor independente.

PROMPT EMERALD PROMPT VAULT INFINITY
V1.0 — Arquitetura, Desenvolvimento e Implementação de uma Biblioteca Particular Inteligente de Prompts

CATEGORIA: Prompt mestre universal para desenvolvimento de aplicações web pessoais de organização, catalogação, armazenamento e recuperação de prompts profissionais.

MISSÃO: desenvolver uma plataforma privada, modular, responsiva e funcional para organizar uma biblioteca pessoal de prompts em arquivos JSON, com interface HTML, CSS e JavaScript, permitindo cadastrar, classificar, pesquisar, visualizar, copiar, editar, importar, exportar e expandir continuamente uma coleção de prompts destinados a diferentes áreas de atuação, ferramentas, formatos documentais e projetos digitais.

ENTREGA ADICIONAL OBRIGATÓRIA: após concluir a plataforma, criar um segundo prompt independente, denominado PROMPT UNIVERSAL DE CONVERSÃO DE PROMPTS PARA JSON, que será utilizado sempre que o usuário desejar transformar um novo prompt em um registro compatível com a biblioteca.

PARTE I — PROMPT MESTRE DE DESENVOLVIMENTO DA PLATAFORMA

1. IDENTIDADE E MISSÃO DA EQUIPE
Atue como uma equipe multidisciplinar de desenvolvimento de produtos digitais, reunindo competências de arquitetura de software, engenharia frontend, design de interfaces, organização da informação, experiência do usuário, acessibilidade, engenharia de dados, segurança, testes e documentação técnica.

Seu objetivo não é produzir uma demonstração visual ou um protótipo superficial. Você deverá entregar uma aplicação funcional, pronta para uso, que se torne a biblioteca pessoal definitiva de prompts do usuário.

A plataforma deverá ser construída considerando um perfil de usuário que trabalha simultaneamente com diversas áreas, interesses e projetos, incluindo, mas não se limitando a: produção de ebooks, livros digitais, manuais, guias e apostilas; criação e edição de documentos HTML, PDF, DOCX, EPUB, TXT, Markdown e outros formatos; desenvolvimento de PWAs, aplicativos, ferramentas web e produtos digitais; pesquisa acadêmica, educação, pedagogia e produção científica; criação de páginas de vendas, infoprodutos, bônus e materiais comerciais; marketing digital, copywriting, produção audiovisual e distribuição de conteúdo; desenvolvimento de prompts para diferentes modelos e assistentes de inteligência artificial; criação de sistemas de organização, análise, conversão, revisão e automação; atividades criativas, técnicas, profissionais e educacionais de diferentes naturezas.

Essa lista serve para orientar a flexibilidade da arquitetura. Não deverá restringir as categorias disponíveis nem induzir a criação de registros fictícios.

A biblioteca deverá permitir cadastrar qualquer prompt, independentemente do assunto, da finalidade, do tamanho ou do formato do resultado solicitado.

Princípio central: a plataforma organiza os prompts; não os executa. Seu papel principal é permitir que o usuário encontre, compreenda, copie, mantenha e reutilize suas ferramentas de trabalho.

2. PRINCÍPIOS ARQUITETURAIS INEGOCIÁVEIS
Universalidade; Modularidade; Persistência; Portabilidade; Integridade; Rastreabilidade; Usabilidade; Privacidade; Manutenibilidade; Escalabilidade; Fidelidade; Compatibilidade. Não implemente funcionalidades meramente decorativas. Cada controle visível deverá realizar a ação anunciada ou estar explicitamente identificado como indisponível.

3. ARQUITETURA DOS ARQUIVOS
Crie uma estrutura de diretórios simples, organizada e adequada à manutenção: emerald-prompt-vault/ com index.html; assets/css/styles.css; assets/js/app.js; assets/js/storage.js; assets/js/search.js; assets/js/import-export.js; assets/js/prompt-viewer.js; assets/icons/; data/manifest.json; data/prompts/prompts-lote-01.json; data/schemas/prompt.schema.json; README.md.

Essa estrutura é uma referência arquitetural, não uma obrigação de multiplicar arquivos desnecessariamente. O HTML, CSS e JavaScript poderão ser incorporados em um único arquivo quando isso for tecnicamente vantajoso para uma versão portátil.

Os arquivos JSON deverão ser independentes da interface e possuir um formato documentado. Não misture HTML, CSS ou JavaScript dentro dos registros JSON.

4. MODELO UNIVERSAL DE DADOS DOS PROMPTS
Projete um esquema JSON estável, extensível e versionado. Cada prompt deverá constituir um registro independente com schema_version; id; title; short_description; category; subcategory; tags; purpose; input_requirements; expected_outputs; compatible_tools; workflow_stage; prompt_type; content; usage_notes; version; created_at; updated_at; favorite; status.

Requisitos do esquema: identificador único; título; descrição breve; categoria; subcategoria; tags; finalidade; requisitos de entrada; resultados esperados; ferramentas ou modelos compatíveis quando conhecidos; etapa do fluxo de trabalho; tipo de prompt; conteúdo integral; observações de uso; versão; data de criação; data de atualização; favorito; estado do registro.

Integridade do conteúdo: o campo content deverá preservar o prompt integral. A aplicação não poderá resumir o prompt automaticamente; eliminar instruções; alterar sua redação silenciosamente; remover blocos de código; substituir trechos por reticências; converter conteúdo estruturado em texto incompleto; truncar prompts extensos. O sistema deverá permitir copiar o conteúdo integral em sua forma armazenada.

Identificadores e versões: cada registro deverá possuir ID único e estável. A atualização de título ou categoria não deverá alterar o ID. A versão do prompt deverá ser separada da versão do esquema JSON.

5. EXPERIÊNCIA PRINCIPAL: BIBLIOTECA DE CARDS
A interface principal deverá apresentar os prompts em cards. Regra visual obrigatória: na visualização padrão da biblioteca, cada card deverá exibir somente título do prompt e breve descrição de sua finalidade. Não apresente o conteúdo integral, listas extensas de tags, metadados técnicos ou longas descrições diretamente nos cards.

Ao clicar em um card, abra uma visualização detalhada do prompt. O detalhe deverá apresentar título; descrição; categoria e subcategoria; tags; finalidade; requisitos de entrada; resultados esperados; compatibilidade conhecida; observações; versão; conteúdo integral; botão para copiar o prompt; botão para editar; botão para favoritar; botão para duplicar; botão para exportar o registro individual.

Botões de copiar: disponibilize botões de cópia para prompt integral; título; descrição; registro JSON completo; campos individuais quando fizer sentido. A cópia deverá utilizar a Clipboard API com fallback. Nunca informe que um texto foi copiado sem verificar que a operação foi concluída.

6. ORGANIZAÇÃO PARA MÚLTIPLAS ÁREAS DE INTERESSE
A biblioteca deverá suportar uma coleção heterogênea de prompts. Implemente categorias e subcategorias flexíveis. Considere categorias iniciais: Produção editorial; Ebooks e livros digitais; Documentos e conversões; Pesquisa acadêmica; Educação; Desenvolvimento web; PWA e aplicativos; HTML, CSS e JavaScript; Inteligência artificial; Engenharia de prompts; Marketing digital; Copywriting; Páginas de vendas; Infoprodutos; Bônus e materiais complementares; Vídeos e audiovisual; Redes sociais; Design e identidade visual; Organização e produtividade; Análise e auditoria; Automação; Outros.

Múltiplas classificações: permita que um mesmo prompt pertença a uma categoria principal e possua várias tags. Não duplique o prompt para representar cada categoria.

Favoritos e coleções: permita favoritar prompts e criar coleções pessoais.

7. PESQUISA, FILTROS E RECUPERAÇÃO
Implemente um mecanismo de pesquisa funcional. A pesquisa deverá contemplar título; descrição; conteúdo integral; categoria; subcategoria; tags; finalidade; observações; ferramentas compatíveis.

Filtros por categoria; subcategoria; tags; favoritos; coleções; status; tipo de prompt; compatibilidade; data de atualização.

Ordenação por título; atualização mais recente; criação; favoritos; ordem alfabética; relevância da pesquisa.

Resultados vazios: mensagem clara e opções para limpar filtros; ajustar termos; cadastrar novo prompt.

8. CADASTRO E CONVERSÃO DE NOVOS PROMPTS
A biblioteca deverá possuir funcionalidade de inclusão. O usuário poderá importar um arquivo JSON compatível; colar um objeto JSON; importar vários registros; cadastrar manualmente; adicionar um prompt convertido por assistente externo; duplicar um prompt existente.

Fluxo de inclusão: ler o registro; validar o esquema; verificar campos obrigatórios; verificar ID; identificar duplicações; apresentar prévia; solicitar confirmação; persistir; atualizar; confirmar.

9. PERSISTÊNCIA, ARQUIVOS JSON E PORTABILIDADE
Não presuma que o JavaScript de uma página web pode modificar livremente arquivos JSON existentes na pasta data/. Escolha uma estratégia tecnicamente viável, preferencialmente IndexedDB para registros e metadados; localStorage apenas para configurações pequenas; arquivos JSON para exportação, backup, migração e importação.

Modo de uso: modo local (abre por duplo clique; dados no mecanismo disponível; exportação manual) e modo servido (abre por HTTP/HTTPS; JSON conforme regras de acesso). Não dependa exclusivamente de fetch() para arquivos locais.

Backup e exportação: exportação de um prompt individual; vários prompts selecionados; biblioteca completa; por categoria; favoritos; coleções; manifesto; importação de backups. Utilize nomes de arquivos coerentes e datas reais quando disponíveis.

10. EDIÇÃO, MANUTENÇÃO E CONTROLE DOS PROMPTS
O usuário deverá conseguir editar título; editar descrição; alterar categoria; alterar subcategoria; gerenciar tags; atualizar observações; editar o conteúdo integral; marcar favoritos; adicionar ou remover coleções; duplicar registros; arquivar prompts; restaurar registros arquivados; excluir mediante confirmação.

Preservação do original: antes de salvar alterações no conteúdo integral, disponibilize uma forma de revisar o texto. A edição não deverá ocorrer por alterações automáticas silenciosas.

11. IDENTIDADE VISUAL E EXPERIÊNCIA DO USUÁRIO
Crie uma identidade visual premium, profissional e discreta. Escolha autonomamente paleta; família tipográfica; escalas tipográficas; espaçamentos; dimensões dos cards; hierarquia visual; ícones; efeitos; comportamento responsivo; estilos de formulários; aparência dos modais; estados de foco e interação.

Requisitos visuais: interface responsiva; tipografia legível; cards com títulos e descrições; navegação intuitiva; pesquisa facilmente acessível; filtros organizados; feedback visual; modais acessíveis; estados de carregamento; mensagens de erro; estados vazios; foco visível; contraste adequado.

12. SEGURANÇA E CONFIABILIDADE
Validação dos arquivos importados; tratamento de erros; prevenção de execução de HTML e JavaScript recebidos dentro de prompts; renderização segura de texto; controle de duplicações; confirmação para exclusões; proteção contra corrupção; tratamento de dados incompletos; exportação de backup.

Os prompts armazenados deverão ser tratados como dados textuais, não como código executável da aplicação. Não insira diretamente o conteúdo de um prompt importado por meio de innerHTML sem sanitização. Prefira textContent para apresentar texto simples.

13. DOCUMENTAÇÃO PARA DESENVOLVEDORES LOW-CODE
O código deverá conter comentários úteis e objetivos. Cada módulo, função importante e componente deverá indicar finalidade; entradas; resultados; dependências; pontos de configuração; como realizar alterações futuras.

Crie um README.md com visão geral; estrutura de diretórios; modelo JSON; procedimento para adicionar prompts; procedimento para importar e exportar; estratégia de persistência; instruções de execução; limitações conhecidas; procedimentos de backup; orientações para personalização.

14. SEGUNDO ENTREGÁVEL OBRIGATÓRIO: PROMPT UNIVERSAL DE CONVERSÃO
Após entregar a plataforma, produza um segundo prompt autônomo. Esse prompt deverá transformar qualquer prompt enviado pelo usuário em um registro JSON compatível com o esquema efetivamente adotado pela plataforma. Ele deverá ser reutilizável indefinidamente. Não poderá depender de um tema específico, de um formato de saída específico ou de um domínio profissional específico.

Entradas do conversor: um prompt completo; um prompt acompanhado de um modelo JSON de referência; um prompt acompanhado de um registro existente; um prompt acompanhado de regras adicionais de classificação; um prompt extenso com múltiplas seções; um prompt que solicita a produção de documentos, códigos, imagens, aplicações ou outros artefatos.

Responsabilidades do conversor: 1. ler integralmente o prompt fornecido; 2. identificar sua finalidade; 3. criar um título claro e identificável; 4. produzir uma descrição breve, útil para o card; 5. classificar o prompt; 6. propor subcategoria e tags pertinentes; 7. identificar requisitos de entrada; 8. identificar os resultados esperados; 9. registrar ferramentas compatíveis somente quando conhecidas; 10. preservar o conteúdo integral no campo content; 11. manter as instruções originais; 12. não resumir nem reescrever o prompt cadastrado; 13. não inventar metadados históricos; 14. gerar um identificador único; 15. aplicar o esquema JSON aceito pela plataforma; 16. validar a sintaxe; 17. entregar um arquivo JSON pronto para importação.

Título e descrição: o título deverá ser curto, específico e reconhecível. A descrição deverá resumir a finalidade prática do prompt em uma ou duas frases. Evite títulos genéricos como "Prompt profissional", "Prompt universal" ou "Ferramenta de IA" quando houver informações suficientes para uma identificação mais precisa.

Fidelidade integral: o conversor não poderá alterar o conteúdo do prompt original para melhorar sua redação, corrigir seu estilo ou simplificar instruções. A única intervenção permitida será a extração dos metadados necessários para o cadastro, sem modificação silenciosa do campo content.

Saída: um arquivo .json válido; um único registro salvo quando o usuário solicitar explicitamente vários; campos compatíveis; conteúdo integral preservado; nenhum texto explicativo dentro do JSON; uma breve identificação externa do nome do arquivo e de sua finalidade.

15. AUTOAUDITORIA E TESTES OBRIGATÓRIOS
Antes de concluir, valide a aplicação quanto a funcionalidades; integridade dos dados; testes reais. Corrija as falhas identificadas antes de entregar.

16. ORDEM FINAL DE ENTREGA
A resposta final deverá apresentar os entregáveis nesta ordem: ENTREGA 1 — Aplicação completa (HTML; CSS; JavaScript; arquivos JSON estruturais; esquema oficial; manifesto, se utilizado; documentação). ENTREGA 2 — Prompt Universal de Conversão para JSON. ENTREGA 3 — Instruções rápidas de utilização. ENTREGA 4 — Relatório de validação.

INSTRUÇÃO FINAL
Execute a missão integralmente. Desenvolva uma biblioteca particular de prompts que seja universal, funcional, expansível, segura, visualmente profissional e tecnicamente compreensível. O sistema deverá permitir que o usuário construa, ao longo do tempo, um patrimônio organizado de ferramentas intelectuais reutilizáveis, sem ficar limitado a um nicho, modelo de IA, formato de documento ou tipo de produto digital.

O prompt conversor deverá funcionar como uma ferramenta complementar permanente: sempre que o usuário enviar um novo prompt, acompanhado desse conversor e, quando necessário, de um modelo de referência, o assistente deverá gerar um JSON compatível com a biblioteca.

Priorize a integridade dos prompts, a simplicidade operacional, a consistência do esquema, a portabilidade e a manutenção de longo prazo.

O resultado final deverá constituir uma plataforma particular de trabalho, não apenas um catálogo estático.

EMERALD PROMPT VAULT INFINITY — UMA BIBLIOTECA PESSOAL, UNIVERSAL E EXPANSÍVEL DE PROMPTS PROFISSIONAIS.

IMPORTANTE: Cada prompt json, deve ter um botão de copiar, não copiar o destino do json, copiar o texto do prompt na íntegra.

<script>
/* ================================================================
   EMERALD PROMPT VAULT INFINITY — JavaScript principal
   Organização: CONFIG → DB → STATE → UTILS → RENDER → SEARCH
                → MODAL → IMPORT/EXPORT → EVENTS → INIT
   ================================================================ */
(() => {
'use strict';

/* ============ CONFIG ============ */
const CONFIG = {
  DB_NAME: 'emerald-vault-db',
  DB_VERSION: 1,
  STORE: 'prompts',
  SCHEMA_VERSION: '1.0'
};

/* ============ UTILS ============ */
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const uid = () => 'prompt-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const nowISO = () => new Date().toISOString();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
));
const debounce = (fn,ms=200) => { let t; return (...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);}; };
const fmtDate = iso => {
  try { return new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
  catch { return '—'; }
};

/* Normaliza um registro vindo de fora para o esquema oficial */
function normalizeRecord(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
  const arr = v => Array.isArray(v) ? v : (v ? [v] : []);
  const str = v => v == null ? '' : String(v);
  const rec = {
    schema_version: str(raw.schema_version || CONFIG.SCHEMA_VERSION),
    id: str(raw.id || uid()),
    title: str(raw.title || raw.titulo || 'Sem título'),
    short_description: str(raw.short_description || raw.description || raw.descricao || ''),
    category: str(raw.category || raw.categoria || 'Outros'),
    subcategory: str(raw.subcategory || raw.subcategoria || ''),
    tags: arr(raw.tags).map(String).filter(Boolean),
    purpose: str(raw.purpose || raw.finalidade || ''),
    input_requirements: arr(raw.input_requirements),
    expected_outputs: arr(raw.expected_outputs),
    compatible_tools: arr(raw.compatible_tools),
    workflow_stage: str(raw.workflow_stage || ''),
    prompt_type: str(raw.prompt_type || 'universal'),
    content: str(raw.content || raw.text || raw.prompt || ''),
    usage_notes: str(raw.usage_notes || ''),
    version: str(raw.version || '1.0'),
    created_at: str(raw.created_at || nowISO()),
    updated_at: str(raw.updated_at || nowISO()),
    favorite: !!raw.favorite,
    status: str(raw.status || 'active')
  };
  if (!rec.title.trim()) return null;
  return rec;
}

/* ============ DB (IndexedDB) ============ */
const DB = {
  _db: null,
  async open() {
    if (this._db) return this._db;
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(CONFIG.DB_NAME, CONFIG.DB_VERSION);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(CONFIG.STORE)) {
          const store = db.createObjectStore(CONFIG.STORE, { keyPath: 'id' });
          store.createIndex('category', 'category', { unique: false });
          store.createIndex('updated_at', 'updated_at', { unique: false });
          store.createIndex('favorite', 'favorite', { unique: false });
        }
      };
      req.onsuccess = () => { this._db = req.result; resolve(this._db); };
      req.onerror = () => reject(req.error);
    });
  },
  async tx(mode='readonly') {
    const db = await this.open();
    return db.transaction(CONFIG.STORE, mode).objectStore(CONFIG.STORE);
  },
  async getAll() {
    const store = await this.tx('readonly');
    return new Promise((res,rej) => {
      const req = store.getAll();
      req.onsuccess = () => res(req.result || []);
      req.onerror = () => rej(req.error);
    });
  },
  async put(rec) {
    const store = await this.tx('readwrite');
    return new Promise((res,rej) => {
      const req = store.put(rec);
      req.onsuccess = () => res(rec);
      req.onerror = () => rej(req.error);
    });
  },
  async putMany(recs) {
    const db = await this.open();
    return new Promise((res,rej) => {
      const tx = db.transaction(CONFIG.STORE, 'readwrite');
      const store = tx.objectStore(CONFIG.STORE);
      recs.forEach(r => store.put(r));
      tx.oncomplete = () => res(recs.length);
      tx.onerror = () => rej(tx.error);
    });
  },
  async delete(id) {
    const store = await this.tx('readwrite');
    return new Promise((res,rej) => {
      const req = store.delete(id);
      req.onsuccess = () => res();
      req.onerror = () => rej(req.error);
    });
  },
  async clear() {
    const store = await this.tx('readwrite');
    return new Promise((res,rej) => {
      const req = store.clear();
      req.onsuccess = () => res();
      req.onerror = () => rej(req.error);
    });
  }
};

/* ============ STATE ============ */
const State = {
  prompts: [],
  filter: {
    q: '',
    category: '',
    tag: '',
    favOnly: false,
    status: 'active'
  },
  sort: 'updated_desc',
  theme: 'dark'
};

/* ============ TOAST ============ */
function toast(msg, type='ok') {
  const icons = {
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    err: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
  };
  const el = document.createElement('div');
  el.className = `toast toast--${type}`;
  el.innerHTML = `<span class="toast__icon">${icons[type]||icons.ok}</span><span>${esc(msg)}</span>`;
  $('#toastRoot').appendChild(el);
  setTimeout(() => {
    el.classList.add('is-out');
    setTimeout(() => el.remove(), 220);
  }, 3200);
}

/* ============ CLIPBOARD ============ */
async function copyText(text, successMsg='Texto copiado para a área de transferência.') {
  if (!text) { toast('Nada para copiar.', 'warn'); return false; }
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast(successMsg, 'ok');
    return true;
  } catch (e) {
    toast('Falha ao copiar: ' + (e.message || 'erro desconhecido'), 'err');
    return false;
  }
}

/* ============ SIDEBAR RENDER ============ */
function renderSidebar() {
  const all = State.prompts;
  const active = all.filter(p => p.status === 'active');

  // Status
  const statusEl = $('#sbStatus');
  const favCount = active.filter(p => p.favorite).length;
  const archCount = all.filter(p => p.status === 'archived').length;
  const items = [
    { key: 'all', label: 'Todos os prompts', count: active.length },
    { key: 'fav', label: 'Favoritos', count: favCount },
    { key: 'arch', label: 'Arquivados', count: archCount }
  ];
  statusEl.innerHTML = items.map(it => {
    let isActive = false;
    if (it.key === 'all') isActive = !State.filter.favOnly && State.filter.status === 'active';
    if (it.key === 'fav') isActive = State.filter.favOnly && State.filter.status === 'active';
    if (it.key === 'arch') isActive = State.filter.status === 'archived';
    return `<li class="sb__item ${isActive ? 'is-active' : ''}" data-status="${it.key}">
      <span>${esc(it.label)}</span><span class="count">${it.count}</span>
    </li>`;
  }).join('');

  // Categorias
  const catEl = $('#sbCategories');
  const catCounts = new Map();
  active.forEach(p => {
    const c = p.category || 'Outros';
    catCounts.set(c, (catCounts.get(c)||0) + 1);
  });
  const cats = Array.from(catCounts.entries()).sort((a,b) => a[0].localeCompare(b[0],'pt-BR'));
  catEl.innerHTML = cats.length
    ? cats.map(([c,n]) => `<li class="sb__item ${State.filter.category===c?'is-active':''}" data-cat="${esc(c)}"><span>${esc(c)}</span><span class="count">${n}</span></li>`).join('')
    : `<li class="sb__empty">Nenhuma categoria ainda.</li>`;

  // Tags
  const tagEl = $('#sbTags');
  const tagCounts = new Map();
  active.forEach(p => (p.tags||[]).forEach(t => {
    tagCounts.set(t, (tagCounts.get(t)||0) + 1);
  }));
  const tags = Array.from(tagCounts.entries()).sort((a,b) => b[1]-a[1]).slice(0, 40);
  tagEl.innerHTML = tags.length
    ? tags.map(([t,n]) => `<span class="sb__tag ${State.filter.tag===t?'is-active':''}" data-tag="${esc(t)}">#${esc(t)} <span style="opacity:.6">${n}</span></span>`).join('')
    : `<span class="sb__empty">Nenhuma tag ainda.</span>`;

  // Bind
  statusEl.querySelectorAll('.sb__item').forEach(el => el.onclick = () => {
    const k = el.dataset.status;
    if (k === 'all') { State.filter.favOnly = false; State.filter.status = 'active'; }
    if (k === 'fav') { State.filter.favOnly = true; State.filter.status = 'active'; }
    if (k === 'arch') { State.filter.favOnly = false; State.filter.status = 'archived'; }
    renderAll();
  });
  catEl.querySelectorAll('.sb__item').forEach(el => el.onclick = () => {
    State.filter.category = State.filter.category === el.dataset.cat ? '' : el.dataset.cat;
    State.filter.status = 'active';
    renderAll();
  });
  tagEl.querySelectorAll('.sb__tag').forEach(el => el.onclick = () => {
    State.filter.tag = State.filter.tag === el.dataset.tag ? '' : el.dataset.tag;
    State.filter.status = 'active';
    renderAll();
  });
}

/* ============ FILTER & SORT ============ */
function filterAndSort() {
  const q = State.filter.q.trim().toLowerCase();
  let arr = State.prompts.slice();
  // status
  arr = arr.filter(p => p.status === State.filter.status);
  // categoria
  if (State.filter.category) arr = arr.filter(p => p.category === State.filter.category);
  // tag
  if (State.filter.tag) arr = arr.filter(p => (p.tags||[]).includes(State.filter.tag));
  // favorito
  if (State.filter.favOnly) arr = arr.filter(p => p.favorite);
  // busca
  if (q) {
    arr = arr.filter(p => {
      const hay = [
        p.title, p.short_description, p.content, p.category, p.subcategory,
        p.purpose, p.usage_notes,
        ...(p.tags||[]),
        ...(p.compatible_tools||[])
      ].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  // sort
  const s = State.sort;
  arr.sort((a,b) => {
    if (s === 'title_asc') return a.title.localeCompare(b.title, 'pt-BR');
    if (s === 'title_desc') return b.title.localeCompare(a.title, 'pt-BR');
    if (s === 'created_desc') return (b.created_at||'').localeCompare(a.created_at||'');
    if (s === 'updated_asc') return (a.updated_at||'').localeCompare(b.updated_at||'');
    if (s === 'fav_first') return (b.favorite?1:0)-(a.favorite?1:0) || (b.updated_at||'').localeCompare(a.updated_at||'');
    return (b.updated_at||'').localeCompare(a.updated_at||''); // updated_desc
  });
  return arr;
}

/* ============ CARD / GRID RENDER ============ */
function renderGrid() {
  const grid = $('#grid');
  const list = filterAndSort();
  const total = State.prompts.filter(p => p.status === State.filter.status).length;

  // info + filtros ativos
  $('#mainInfo').innerHTML = list.length
    ? `<strong>${list.length}</strong> de ${total} prompt${total!==1?'s':''}`
    : `Nenhum resultado em ${total} prompt${total!==1?'s':''}`;

  renderActiveFilters();

  if (!list.length) {
    grid.innerHTML = renderEmptyState(total);
    bindEmptyActions();
    return;
  }

  grid.innerHTML = list.map(p => `
    <article class="card" data-id="${esc(p.id)}" tabindex="0" role="button" aria-label="Abrir prompt ${esc(p.title)}">
      <div class="card__head">
        <h3 class="card__title">${esc(p.title)}</h3>
        <button class="card__fav ${p.favorite?'is-active':''}" data-fav="${esc(p.id)}" aria-label="Alternar favorito" title="Favorito">
          <svg viewBox="0 0 24 24" fill="${p.favorite?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </button>
      </div>
      <p class="card__desc">${esc(p.short_description || 'Sem descrição.')}</p>
    </article>
  `).join('');

  // Eventos
  grid.querySelectorAll('.card').forEach(card => {
    const open = () => openDetail(card.dataset.id);
    card.addEventListener('click', e => {
      if (e.target.closest('[data-fav]')) return;
      open();
    });
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
    });
  });
  grid.querySelectorAll('[data-fav]').forEach(btn => btn.addEventListener('click', async e => {
    e.stopPropagation();
    const id = btn.dataset.fav;
    const p = State.prompts.find(x => x.id === id);
    if (!p) return;
    p.favorite = !p.favorite;
    p.updated_at = nowISO();
    await DB.put(p);
    toast(p.favorite ? 'Adicionado aos favoritos.' : 'Removido dos favoritos.', 'ok');
    renderAll();
  }));
}

function renderEmptyState(total) {
  if (!total) {
    return `
      <div class="empty">
        <svg class="empty__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6l-8-4Z"/>
        </svg>
        <h2>Sua biblioteca está vazia</h2>
        <p>Comece criando um novo prompt ou importando um arquivo JSON compatível.</p>
        <div class="empty__actions">
          <button class="btn btn--primary" data-act="new">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Novo prompt
          </button>
          <button class="btn" data-act="import">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
            Importar JSON
          </button>
        </div>
      </div>`;
  }
  return `
    <div class="empty">
      <svg class="empty__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <h2>Nenhum prompt encontrado</h2>
      <p>Ajuste a pesquisa ou remova alguns filtros para ver mais resultados.</p>
      <div class="empty__actions">
        <button class="btn" data-act="clear-filters">Limpar filtros</button>
      </div>
    </div>`;
}

function bindEmptyActions() {
  $$('#grid [data-act]').forEach(b => b.onclick = () => {
    const a = b.dataset.act;
    if (a === 'new') openEdit();
    if (a === 'import') openImport();
    if (a === 'clear-filters') {
      State.filter = { q: '', category: '', tag: '', favOnly: false, status: 'active' };
      $('#searchInput').value = '';
      $('#searchWrap').classList.remove('has-value');
      renderAll();
    }
  });
}

function renderActiveFilters() {
  const wrap = $('#activeFilters');
  const chips = [];
  if (State.filter.q) chips.push({k:'q', label:`Busca: "${State.filter.q}"`});
  if (State.filter.category) chips.push({k:'category', label:`Categoria: ${State.filter.category}`});
  if (State.filter.tag) chips.push({k:'tag', label:`#${State.filter.tag}`});
  if (State.filter.favOnly) chips.push({k:'favOnly', label:'Somente favoritos'});
  wrap.innerHTML = chips.map(c => `<span class="chip" data-clear="${c.k}">${esc(c.label)}<button aria-label="Remover filtro">✕</button></span>`).join('');
  wrap.querySelectorAll('[data-clear]').forEach(el => el.onclick = () => {
    const k = el.dataset.clear;
    if (k === 'q') { State.filter.q = ''; $('#searchInput').value=''; $('#searchWrap').classList.remove('has-value'); }
    if (k === 'category') State.filter.category = '';
    if (k === 'tag') State.filter.tag = '';
    if (k === 'favOnly') State.filter.favOnly = false;
    renderAll();
  });
}

function renderAll() {
  renderSidebar();
  renderGrid();
}

/* ============ MODAL ============ */
function closeModal() {
  const m = $('#modal');
  m.classList.remove('is-open');
  m.innerHTML = '';
  document.body.style.overflow = '';
}
function openModal(contentHTML, opts={}) {
  const m = $('#modal');
  m.innerHTML = `<div class="modal__box ${opts.wide?'modal__box--wide':''} ${opts.narrow?'modal__box--narrow':''}" role="document">${contentHTML}</div>`;
  m.classList.add('is-open');
  document.body.style.overflow = 'hidden';
  // bind close
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
  m.addEventListener('click', e => { if (e.target === m) closeModal(); }, { once: true });
  // focus first focusable
  setTimeout(() => {
    const f = m.querySelector('input,button,textarea,select,[tabindex]:not([tabindex="-1"])');
    if (f) f.focus();
  }, 50);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ============ DETAIL ============ */
function openDetail(id) {
  const p = State.prompts.find(x => x.id === id);
  if (!p) return;
  const body = `
    <div class="modal__head">
      <h2 class="modal__title">${esc(p.title)}</h2>
      <button class="modal__close" data-close aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal__body">
      <div class="detail__meta">

  $('#btnExportOne').onclick = () => exportRecords([p], `prompt-${slug(p.title)}.json`);
  $('#btnFav').onclick = async () => {
    p.favorite = !p.favorite; p.updated_at = nowISO();
    await DB.put(p); toast('Favorito atualizado.', 'ok');
    renderAll(); openDetail(p.id);
  };
  $('#btnDup').onclick = async () => {
    const copy = { ...p, id: uid(), title: p.title + ' (cópia)', created_at: nowISO(), updated_at: nowISO() };
    await DB.put(copy);
    State.prompts.push(copy);
    toast('Prompt duplicado.', 'ok');
    closeModal(); renderAll();
  };
  $('#btnEdit').onclick = () => { closeModal(); openEdit(p.id); };
  $('#btnDel').onclick = async () => {
    if (!confirm(`Excluir definitivamente "${p.title}"? Esta ação não pode ser desfeita.`)) return;
    await DB.delete(p.id);
    State.prompts = State.prompts.filter(x => x.id !== p.id);
    toast('Prompt excluído.', 'ok');
    closeModal(); renderAll();
  };
}

function slug(s) {
  return String(s || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || 'prompt';
}

/* ============ IMPORT ============ */
function openImport() {
  const body = `
    <div class="modal__head">
      <h2 class="modal__title">Importar prompts</h2>
      <button class="modal__close" data-close aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal__body">
      <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Selecionar arquivo JSON">
        <svg class="dropzone__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
        <h3>Solte o arquivo .json aqui</h3>
        <p>ou clique para selecionar</p>
        <input type="file" id="fileInput" accept=".json,application/json" hidden>
      </div>
      <div class="divider">ou cole o JSON</div>
      <textarea class="txa txa--mono" id="importText" placeholder='{"title":"...","content":"..."}  ou  [ {...}, {...} ]'></textarea>
      <div class="preview-list" id="previewList"></div>
    </div>
    <div class="modal__foot">
      <button class="btn" data-close>Cancelar</button>
      <button class="btn" id="btnPreview">Pré-visualizar</button>
      <button class="btn btn--primary" id="btnConfirmImport" disabled>Importar</button>
    </div>
  `;
  openModal(body, { wide: true });

  let pending = [];
  const drop = $('#dropzone');
  const fi = $('#fileInput');

  const previewFromText = (text) => {
    let parsed;
    try { parsed = JSON.parse(text); }
    catch (e) { toast('JSON inválido: ' + e.message, 'err'); return; }
    let arr = [];
    if (Array.isArray(parsed)) arr = parsed;
    else if (parsed && typeof parsed === 'object') {
      if (Array.isArray(parsed.prompts)) arr = parsed.prompts;
      else arr = [parsed];
    }
    const items = [];
    for (const raw of arr) {
      const rec = normalizeRecord(raw);
      if (!rec) { items.push({ ok:false, err:'Registro inválido', raw }); continue; }
      const dup = State.prompts.find(x => x.id === rec.id);
      items.push({ ok:true, rec, dup });
    }
    pending = items.filter(i => i.ok).map(i => i.rec);
    renderPreview(items);
  };

  const renderPreview = (items) => {
    const el = $('#previewList');
    if (!items.length) { el.innerHTML = ''; return; }
    el.innerHTML = items.map(it => {
      if (!it.ok) {
        return `<div class="preview-item">
          <svg class="preview-item__icon err" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          <div class="preview-item__body"><div class="preview-item__title">Registro inválido</div><div class="preview-item__note">${esc(it.err)}</div></div>
        </div>`;
      }
      const dupNote = it.dup ? ` · <span style="color:var(--warn)">ID já existe — será sobrescrito</span>` : '';
      return `<div class="preview-item">
        <svg class="preview-item__icon ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        <div class="preview-item__body">
          <div class="preview-item__title">${esc(it.rec.title)}</div>
          <div class="preview-item__note">${esc(it.rec.category)} · ${(it.rec.content||'').length} caracteres${dupNote}</div>
        </div>
      </div>`;
    }).join('');
    $('#btnConfirmImport').disabled = !pending.length;
  };

  drop.onclick = () => fi.click();
  drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fi.click(); } };
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('is-over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('is-over'); }));
  drop.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if (file) readFile(file);
  });
  fi.onchange = () => { if (fi.files[0]) readFile(fi.files[0]); };

  const readFile = (file) => {
    const r = new FileReader();
    r.onload = () => { $('#importText').value = r.result; previewFromText(r.result); };
    r.readAsText(file, 'utf-8');
  };

  $('#btnPreview').onclick = () => previewFromText($('#importText').value);

  $('#btnConfirmImport').onclick = async () => {
    if (!pending.length) return;
    await DB.putMany(pending);
    // Atualiza estado
    pending.forEach(r => {
      const i = State.prompts.findIndex(x => x.id === r.id);
      if (i >= 0) State.prompts[i] = r; else State.prompts.push(r);
    });
    toast(`${pending.length} prompt(s) importado(s).`, 'ok');
    closeModal(); renderAll();
  };
}

/* ============ EXPORT ============ */
function exportRecords(records, filename) {
  if (!records || !records.length) { toast('Nada para exportar.', 'warn'); return; }
  const payload = records.length === 1 ? records[0] : {
    schema_version: CONFIG.SCHEMA_VERSION,
    exported_at: nowISO(),
    count: records.length,
    prompts: records
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename || `emerald-vault-export-${Date.now()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 500);
  toast(`${records.length} prompt(s) exportado(s).`, 'ok');
}

/* ============ THEME ============ */
function setTheme(t) {
  State.theme = t;
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('emerald-theme', t); } catch {}
  // atualiza ícone
  const icon = $('#iconTheme');
  if (icon) icon.innerHTML = t === 'dark'
    ? `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>`
    : `<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>`;

/* ============ EVENTS ============ */
function bindEvents() {
  // Busca
  const si = $('#searchInput');
  si.addEventListener('input', debounce(() => {
    State.filter.q = si.value;
    $('#searchWrap').classList.toggle('has-value', !!si.value);
    renderGrid();
  }, 160));
  si.addEventListener('keydown', e => {
    if (e.key === 'Escape') { si.value=''; State.filter.q=''; $('#searchWrap').classList.remove('has-value'); renderGrid(); }
  });
  $('#searchClear').onclick = () => { si.value=''; State.filter.q=''; $('#searchWrap').classList.remove('has-value'); renderGrid(); si.focus(); };

  // Sort
  $('#sortSel').onchange = e => { State.sort = e.target.value; renderGrid(); };

  // Novo / Import / Export / Tema
  $('#btnNew').onclick = () => openEdit();
  $('#btnImport').onclick = openImport;
  $('#btnExport').onclick = openExport;
  $('#btnTheme').onclick = () => setTheme(State.theme === 'dark' ? 'light' : 'dark');

  // Sidebar mobile
  const sb = $('#sidebar'), sbb = $('#sbBackdrop');
  const toggleSb = (open) => {
    sb.classList.toggle('is-open', open);
    sbb.classList.toggle('is-open', open);
  };
  $('#btnSidebar').onclick = () => toggleSb(!sb.classList.contains('is-open'));
  sbb.onclick = () => toggleSb(false);

  // Atalhos
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    const isField = tag === 'input' || tag === 'textarea' || tag === 'select';
    if (isField) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
      e.preventDefault(); si.focus(); si.select();
    }
    if (e.key === 'n' || e.key === 'N') { if (!e.ctrlKey && !e.metaKey) { e.preventDefault(); openEdit(); } }
  });
}

/* ============ INIT ============ */
async function init() {
  // Tema
  let savedTheme = 'dark';
  try { savedTheme = localStorage.getItem('emerald-theme') || 'dark'; } catch {}
  setTheme(savedTheme);

  try {
    await DB.open();
    await seedIfEmpty();
    State.prompts = await DB.getAll();
  } catch (e) {
    console.error(e);
    toast('Erro ao abrir o banco de dados. Verifique se o navegador permite IndexedDB.', 'err');
    State.prompts = [];
  }

  bindEvents();
  renderAll();
}

document.addEventListener('DOMContentLoaded', init);
})();
</script>
