<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Emerald Prompt Vault Infinity — biblioteca pessoal, universal e expansível de prompts profissionais.">
<meta name="theme-color" content="#0a0f0d">
<meta name="color-scheme" content="dark light">
<!--
  ============================================================
  GITHUB PAGES — NOTAS DE PUBLICAÇÃO
  ------------------------------------------------------------
  - Este arquivo deve ser salvo como `index.html` na raiz do
    repositório para ser servido em https://usuario.github.io/repo/
  - Nenhuma dependência externa: HTML, CSS, JS, metadados e
    sementes estão todos incorporados neste único arquivo.
  - Persistência: IndexedDB (biblioteca) + localStorage (tema).
  - Clipboard API exige contexto seguro (HTTPS ou localhost).
    GitHub Pages entrega HTTPS automaticamente.
  - Não há backend, Service Worker, manifest PWA ou chamadas de rede.
  - Totalmente compatível com file:// (funciona offline local).
  ============================================================
-->
<title>Emerald Prompt Vault — Biblioteca Pessoal de Prompts</title>
<style>
/* ================================================================
   EMERALD PROMPT VAULT INFINITY — Estilos
   Estrutura: TOKENS → RESET → LAYOUT → HEADER → SIDEBAR → GRID
              → CARDS → MODAIS → FORMULÁRIOS → TOAST → RESPONSIVO
   ================================================================ */

/* ============ TOKENS ============ */
:root {
  --em-100:#d1fae5; --em-200:#a7f3d0; --em-300:#6ee7b7; --em-400:#34d399;
  --em-500:#10b981; --em-600:#059669; --em-700:#047857; --em-800:#065f46;
  --bg:#0a0f0d; --bg-2:#0f1613; --surface:#151d1a; --surface-2:#1c2622;
  --surface-3:#22302b; --border:#243330; --border-2:#2e403c;
  --text:#e8f0ed; --text-muted:#8fa39d; --text-dim:#5c6e68;
  --accent:var(--em-500); --accent-hover:var(--em-400); --accent-soft:rgba(16,185,129,.12);
  --danger:#ef4444; --warn:#f59e0b; --info:#3b82f6;
  --radius:12px; --radius-sm:8px; --radius-lg:18px; --radius-full:999px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.25);
  --shadow:0 4px 20px rgba(0,0,0,.35);
  --shadow-lg:0 20px 60px rgba(0,0,0,.5);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:'SF Mono',Monaco,'Cascadia Code','Fira Code',Consolas,monospace;
  --t:.18s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"] {
  --bg:#f6faf8; --bg-2:#eef4f1; --surface:#ffffff; --surface-2:#f3f8f6;
  --surface-3:#e8f0ed; --border:#d8e5e0; --border-2:#c2d5cf;
  --text:#0f1613; --text-muted:#5a706a; --text-dim:#8ba39c;
  --accent-soft:rgba(16,185,129,.10);
  --shadow-sm:0 1px 3px rgba(0,0,0,.06);
  --shadow:0 4px 20px rgba(0,0,0,.08);
  --shadow-lg:0 20px 60px rgba(0,0,0,.15);
}

/* ============ RESET ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  line-height:1.55; font-size:15px; min-height:100vh;
  transition:background var(--t),color var(--t);
  overflow-x:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
img,svg{display:block;max-width:100%}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}

/* ============ LAYOUT ============ */
.app{display:flex;flex-direction:column;min-height:100vh}
.layout{display:grid;grid-template-columns:260px 1fr;flex:1;min-height:0}

/* ============ HEADER ============ */
.hdr{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;
  padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);
}
.hdr__brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.hdr__logo{width:28px;height:28px;color:var(--accent);flex-shrink:0}
.hdr__search{position:relative;max-width:640px;width:100%;justify-self:center}
.hdr__search input{
  width:100%;padding:10px 40px 10px 40px;border-radius:var(--radius-full);
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  font-size:14px;transition:border var(--t),background var(--t);
}
.hdr__search input:focus{outline:none;border-color:var(--accent);background:var(--surface-3)}
.hdr__search::before{
  content:"";position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;background:currentColor;color:var(--text-dim);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><circle cx='11' cy='11' r='7'/><path d='m21 21-4.3-4.3'/></svg>") center/contain no-repeat;
          mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><circle cx='11' cy='11' r='7'/><path d='m21 21-4.3-4.3'/></svg>") center/contain no-repeat;
}
.hdr__search-clear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;display:none;align-items:center;justify-content:center;
  color:var(--text-muted);font-size:14px;
}
.hdr__search.has-value .hdr__search-clear{display:flex}
.hdr__search-clear:hover{background:var(--surface-3);color:var(--text)}
.hdr__actions{display:flex;gap:8px;align-items:center;justify-self:end}

/* ============ BOTÕES ============ */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;
  border-radius:var(--radius-sm);font-size:13px;font-weight:500;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  transition:all var(--t);white-space:nowrap;
}
.btn:hover{background:var(--surface-3);border-color:var(--border-2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn--primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn--primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn--danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn--danger:hover{background:var(--danger);color:#fff}
.btn--ghost{background:transparent;border-color:transparent}
.btn--ghost:hover{background:var(--surface-2)}
.btn--icon{padding:8px;width:38px;height:38px;justify-content:center}
.btn--sm{padding:6px 10px;font-size:12px}
.btn svg{width:16px;height:16px;flex-shrink:0}
.btn--primary svg{color:#fff}
.hdr__actions .btn span.lbl{display:inline}

/* ============ SIDEBAR ============ */
.sidebar{
  background:var(--surface);border-right:1px solid var(--border);
  padding:20px 14px;overflow-y:auto;max-height:calc(100vh - 61px);
  position:sticky;top:61px;height:calc(100vh - 61px);
}
.sb__section{margin-bottom:22px}
.sb__title{
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-dim);padding:0 10px;margin-bottom:8px;
  display:flex;align-items:center;justify-content:space-between;
}
.sb__title button{color:var(--text-dim);font-size:16px;line-height:1;padding:0 4px}
.sb__title button:hover{color:var(--accent)}
.sb__list{list-style:none;display:flex;flex-direction:column;gap:2px}
.sb__item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 10px;border-radius:var(--radius-sm);cursor:pointer;
  font-size:13px;color:var(--text-muted);transition:all var(--t);user-select:none;
}
.sb__item:hover{background:var(--surface-2);color:var(--text)}
.sb__item.is-active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sb__item .count{
  font-size:11px;padding:1px 7px;border-radius:999px;
  background:var(--surface-3);color:var(--text-dim);font-weight:600;
}
.sb__item.is-active .count{background:var(--accent);color:#fff}
.sb__empty{font-size:12px;color:var(--text-dim);padding:6px 10px;font-style:italic}
.sb__tag{
  display:inline-flex;align-items:center;gap:4px;padding:3px 9px;margin:2px 3px 2px 0;
  border-radius:var(--radius-full);background:var(--surface-2);border:1px solid var(--border);
  font-size:11px;color:var(--text-muted);cursor:pointer;transition:all var(--t);
}
.sb__tag:hover{border-color:var(--accent);color:var(--accent)}
.sb__tag.is-active{background:var(--accent);border-color:var(--accent);color:#fff}
.sb__tags{display:flex;flex-wrap:wrap;padding:0 4px}

/* ============ MAIN ============ */
.main{padding:20px 24px 60px;min-width:0}
.main__toolbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:18px;flex-wrap:wrap;
}
.main__info{font-size:13px;color:var(--text-muted)}
.main__info strong{color:var(--text);font-weight:600}
.main__controls{display:flex;gap:8px;align-items:center}
.sel{
  padding:7px 30px 7px 11px;border-radius:var(--radius-sm);font-size:13px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238fa39d' stroke-width='2'><path d='m6 9 6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 8px center;background-size:14px;
}
.sel:focus{outline:none;border-color:var(--accent)}
.active-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;
  border-radius:var(--radius-full);background:var(--accent-soft);
  border:1px solid var(--accent);color:var(--accent);font-size:12px;
}
.chip button{color:inherit;font-size:14px;line-height:1;opacity:.7}
.chip button:hover{opacity:1}

/* ============ GRID & CARDS ============ */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:14px;
}
.card{
  position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;cursor:pointer;
  transition:all var(--t);display:flex;flex-direction:column;
  min-height:130px;overflow:hidden;
}
.card::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,transparent 60%,var(--accent-soft));
  opacity:0;transition:opacity var(--t);
}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.card:hover::before{opacity:1}
.card__head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.card__title{
  font-size:15px;font-weight:600;line-height:1.35;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card__fav{
  flex-shrink:0;width:22px;height:22px;color:var(--text-dim);
  transition:color var(--t),transform var(--t);
}
.card__fav:hover{transform:scale(1.15)}
.card__fav.is-active{color:var(--em-400)}
.card__fav svg{width:100%;height:100%}
.card__desc{
  font-size:13px;color:var(--text-muted);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  flex:1;
}

/* Empty state */
.empty{
  grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--text-muted);
}
.empty__icon{width:64px;height:64px;margin:0 auto 18px;color:var(--text-dim);opacity:.6}
.empty h2{font-size:18px;margin-bottom:8px;color:var(--text);font-weight:600}
.empty p{font-size:14px;margin-bottom:22px;max-width:420px;margin-left:auto;margin-right:auto}
.empty__actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ============ MODAIS ============ */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;
  opacity:0;pointer-events:none;transition:opacity var(--t);
}
.modal.is-open{opacity:1;pointer-events:auto}
.modal__box{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  width:100%;max-width:820px;max-height:92vh;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
  transform:translateY(10px);transition:transform var(--t);
}
.modal.is-open .modal__box{transform:translateY(0)}
.modal__box--wide{max-width:960px}
.modal__box--narrow{max-width:520px}
.modal__head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:18px 22px;border-bottom:1px solid var(--border);
}
.modal__title{font-size:17px;font-weight:600;line-height:1.3;flex:1;min-width:0}
.modal__close{
  flex-shrink:0;width:34px;height:34px;border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);transition:all var(--t);
}
.modal__close:hover{background:var(--surface-2);color:var(--text)}
.modal__close svg{width:18px;height:18px}
.modal__body{padding:22px;overflow-y:auto;flex:1}
.modal__foot{
  padding:14px 22px;border-top:1px solid var(--border);
  display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;
  background:var(--surface-2);
}
.modal__foot--spread{justify-content:space-between}

/* Detail */
.detail__meta{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border);
}
.detail__field label{
  display:block;font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--text-dim);margin-bottom:4px;
}
.detail__field .val{font-size:13px;color:var(--text);word-break:break-word}
.detail__field .val.is-muted{color:var(--text-muted);font-style:italic}
.detail__section{margin-bottom:22px}
.detail__section h3{
  font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-dim);margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.detail__section p,.detail__section ul{font-size:14px;color:var(--text-muted);line-height:1.65}
.detail__section ul{padding-left:20px}
.detail__tags{display:flex;flex-wrap:wrap;gap:6px}
.detail__tags .tag{
  padding:3px 10px;border-radius:var(--radius-full);background:var(--surface-2);
  border:1px solid var(--border);font-size:12px;color:var(--text-muted);
}
.detail__prompt{
  position:relative;background:var(--bg-2);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;font-family:var(--mono);
  font-size:12.5px;line-height:1.65;color:var(--text);white-space:pre-wrap;
  word-break:break-word;max-height:520px;overflow-y:auto;
}
.detail__prompt-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:10px;
}
.detail__prompt-head h3{margin:0}

/* Form */
.form{display:grid;gap:14px}
.form__row{display:grid;gap:6px}
.form__row--2{grid-template-columns:1fr 1fr;gap:14px}
.form__row label{font-size:12px;font-weight:600;color:var(--text)}
.form__row label .req{color:var(--danger);margin-left:2px}
.form__hint{font-size:11px;color:var(--text-dim);margin-top:2px}
.inp,.txa{
  width:100%;padding:10px 12px;border-radius:var(--radius-sm);
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  font-size:14px;transition:border var(--t),background var(--t);
}
.inp:focus,.txa:focus{outline:none;border-color:var(--accent);background:var(--surface-3)}
.txa{min-height:110px;resize:vertical;font-family:inherit;line-height:1.55}
.txa--mono{font-family:var(--mono);font-size:12.5px;min-height:260px}
.txa--sm{min-height:80px}

/* Import */
.dropzone{
  border:2px dashed var(--border-2);border-radius:var(--radius);padding:30px 20px;
  text-align:center;transition:all var(--t);cursor:pointer;
}
.dropzone:hover,.dropzone.is-over{border-color:var(--accent);background:var(--accent-soft)}
.dropzone__icon{width:36px;height:36px;margin:0 auto 10px;color:var(--text-dim)}
.dropzone h3{font-size:14px;margin-bottom:4px;font-weight:600}
.dropzone p{font-size:12px;color:var(--text-muted)}
.divider{
  display:flex;align-items:center;gap:10px;margin:18px 0;
  font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;
}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.preview-list{
  display:flex;flex-direction:column;gap:8px;margin-top:16px;
  max-height:320px;overflow-y:auto;
}
.preview-item{
  padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface-2);
  border:1px solid var(--border);font-size:13px;
  display:flex;align-items:flex-start;gap:10px;
}
.preview-item__icon{
  width:18px;height:18px;flex-shrink:0;margin-top:2px;
}
.preview-item__icon.ok{color:var(--em-400)}
.preview-item__icon.err{color:var(--danger)}
.preview-item__icon.warn{color:var(--warn)}
.preview-item__body{flex:1;min-width:0}
.preview-item__title{font-weight:600;margin-bottom:2px;color:var(--text)}
.preview-item__note{font-size:11.5px;color:var(--text-muted)}

/* Toast */
.toast-root{
  position:fixed;bottom:24px;right:24px;z-index:200;
  display:flex;flex-direction:column;gap:10px;pointer-events:none;
}
.toast{
  padding:12px 16px;border-radius:var(--radius);background:var(--surface);
  border:1px solid var(--border);box-shadow:var(--shadow-lg);
  font-size:13.5px;color:var(--text);min-width:220px;max-width:360px;
  display:flex;align-items:center;gap:10px;pointer-events:auto;
  animation:toastIn .25s cubic-bezier(.4,0,.2,1);
}
.toast.is-out{animation:toastOut .2s forwards}
.toast__icon{width:18px;height:18px;flex-shrink:0}
.toast--ok{border-color:var(--em-600)}
.toast--ok .toast__icon{color:var(--em-400)}
.toast--err{border-color:var(--danger)}
.toast--err .toast__icon{color:var(--danger)}
.toast--warn{border-color:var(--warn)}
.toast--warn .toast__icon{color:var(--warn)}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(20px) scale(.96)}}

/* ============ RESPONSIVO ============ */
.sidebar__backdrop{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:59;
}
.sidebar__backdrop.is-open{display:block}

@media (max-width:960px){
  .layout{grid-template-columns:1fr}
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;width:280px;max-height:none;height:100vh;
    z-index:60;transform:translateX(-100%);transition:transform var(--t);
  }
  .sidebar.is-open{transform:translateX(0)}
  .main{padding:16px}
  .hdr{grid-template-columns:auto 1fr auto;padding:10px 14px;gap:10px}
  .hdr__brand span{display:none}
  .hdr__actions .btn span.lbl{display:none}
  .hdr__actions .btn{padding:8px;width:38px;height:38px;justify-content:center}
  .hdr__actions .btn--icon{width:38px;height:38px}
  .mobile-only{display:inline-flex !important}
}
@media (max-width:560px){
  .hdr__search input{font-size:16px} /* evita zoom em iOS */
  .grid{grid-template-columns:1fr;gap:12px}
  .main{padding:14px 12px 80px}
  .modal{padding:0;align-items:flex-end}
  .modal__box{
    max-height:96vh;border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    max-width:100%;
  }
  .modal__head{padding:14px 16px}
  .modal__body{padding:16px}
  .modal__foot{padding:12px 16px}
  .detail__meta{grid-template-columns:1fr 1fr;gap:12px}
  .form__row--2{grid-template-columns:1fr}
  .toast-root{left:12px;right:12px;bottom:12px}
  .toast{min-width:0;max-width:none}
}
.mobile-only{display:none}

/* Reduced motion */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="app">

  <!-- ===================== HEADER ===================== -->
  <header class="hdr">

Transforme o documento recebido em uma experiência HTML equivalente a um livro/documento digital premium, preservando seu conteúdo e sua lógica original, mas melhorando sua: apresentação, organização, navegação, legibilidade, hierarquia, experiência de leitura, responsividade, acessibilidade, funcionalidade.

54. RESPONSIVIDADE NÃO É SINÔNIMO DE REFLOW
============================================================
Para documentos editoriais A4: não transforme automaticamente o conteúdo em um fluxo líquido sem página. Preserve PÁGINA A4 + ESCALA PROPORCIONAL.

============================================================
55. ZERO OVERFLOW HORIZONTAL
============================================================
A página não poderá apresentar rolagem horizontal involuntária. Investigue largura; min-width; transforms; grids; flex; imagens; tabelas; modais; elementos absolutos; elementos fixed; pseudo-elementos. Não utilize overflow-x:hidden simplesmente para esconder um erro estrutural.

============================================================
56. VIEWPORT
============================================================
Use <meta name="viewport" content="width=device-width, initial-scale=1.0"> e html { -webkit-text-size-adjust: 100%; } quando apropriado.

============================================================
57. BREAKPOINTS
============================================================
Audite pelo menos 320px; 360px; 375px; 390px; 414px; 430px; 480px; 600px; 768px; 900px; 1024px; 1280px; 1440px; 1920px. Não crie breakpoints sem necessidade.

============================================================
58. ALTURA DA VIEWPORT
============================================================
Teste também telas com pouca altura. Especialmente smartphones landscape; notebooks; tablets landscape. Modais, toolbars e controles fixos devem respeitar 100vh ou equivalentes modernos quando aplicável.

============================================================
59. CONTROLES FIXOS
============================================================
Toolbar, navegação, botões e elementos flutuantes: não podem cobrir o texto; não podem sair da tela; não podem criar overflow; não podem se sobrepor; devem adaptar seu tamanho.

============================================================
60. IMAGENS
============================================================
Preserve proporções. Use max-width: 100%; height: auto; quando apropriado. Para componentes com proporção definida: utilize aspect-ratio.

============================================================
61. VÍDEOS
============================================================
Quando existirem: responsivos; proporcionais; confinados ao container; acessíveis. Nunca causar overflow.

============================================================
62. TABELAS
============================================================
Tabelas deverão caber na página; permanecer legíveis; possuir estratégia para mobile; evitar quebra destrutiva. Se necessário usar scroll interno controlado. Nunca perder dados.

============================================================
63. CARDS
============================================================
Cards deverão adaptar-se conforme o espaço. No mobile: uma coluna quando necessário; duas somente quando houver espaço real; altura automática; conteúdo legível.

============================================================
64. GRID E FLEXBOX
============================================================
Verifique flex-wrap; min-width:0; gap; grids rígidos; colunas incompatíveis; largura dos filhos.

============================================================
65. TIPOGRAFIA RESPONSIVA
============================================================
Quando necessário use font-size: clamp(...) para títulos; subtítulos; elementos da toolbar; labels. Não permita texto cortado.

============================================================
66. ELEMENTOS ABSOLUTOS
============================================================
Audite position:absolute e position:fixed e seus top; left; right; bottom; transform. Corrija somente quando causarem problemas.

============================================================
67. REGRA DE PRESERVAÇÃO RESPONSIVA
============================================================
O desktop deve continuar correto. O mobile não deve destruir o desktop. O tablet não deve destruir o mobile. Todas as adaptações deverão ser progressivas.

============================================================
68. SEGURANÇA DO CONTEÚDO IMPORTADO
============================================================
Especialmente para HTML, EPUB e outros formatos que possam carregar código: remova ou sanitize <script> importado; event handlers inline; URLs JavaScript; iframes não autorizados; conteúdo executável; atributos perigosos; código malicioso. Preserve somente o que for necessário ao conteúdo.

============================================================
69. LINKS IMPORTADOS
============================================================
Preserve links válidos. Quando apropriado use target="_blank" rel="noopener noreferrer" para links externos. Não invente URLs. Não corrija silenciosamente uma URL desconhecida sem evidência.

============================================================
70. IMAGENS DO DOCUMENTO
============================================================
Quando a origem fornecer imagens e elas puderem ser preservadas: integre-as de forma adequada. Quando imagens não puderem ser extraídas: não invente outras imagens. Não exiba ícones de imagem quebrada.

============================================================
71. ASSETS
============================================================
Quando depender de imagens externas prefira assets/ com nomes organizados. Exemplo: assets/capa.svg; assets/imagem-01.svg; assets/figura-02.svg. Quando uma mídia real não estiver disponível: não invente seu conteúdo.

============================================================
72. ARQUITETURA DO HTML
============================================================
Entregue UM ÚNICO ARQUIVO index.html. Dentro dele: html; head (metadata + style); body (interface + conteúdo + navegação + script).

============================================================
73. CSS
============================================================
O CSS deverá estar dentro do próprio HTML. Não crie styles.css; theme.css; responsive.css.

============================================================
74. JAVASCRIPT
============================================================
O JavaScript deverá estar dentro do próprio HTML. Não crie script.js; app.js; reader.js.

============================================================
75. DEPENDÊNCIAS
============================================================
Prefira HTML5; CSS3; JavaScript vanilla. Evite bibliotecas externas desnecessárias. Se uma dependência for indispensável, especialmente para EPUB: use biblioteca pública; estável; leve; compatível com GitHub Pages; sem backend; sem build. Nenhum arquivo auxiliar deverá ser obrigatório para o funcionamento básico do documento.

============================================================
76. DESIGN SYSTEM
============================================================
Crie tokens CSS: :root { --color-bg; --color-surface; --color-text; --color-muted; --color-accent; --page-width: 21cm; --page-height: 29.7cm; --content-width: 16cm; --content-height: 26cm; }. Adapte os valores à identidade visual escolhida.

============================================================
77. NAMESPACE
============================================================
Sempre que possível use namespace para evitar conflitos. Exemplo: .gold-reader .gold-reader__toolbar .gold-reader__page .gold-reader__content .gold-reader__navigation .gold-reader__modal.

============================================================
78. ARQUITETURA SEMÂNTICA
============================================================
Utilize main; article; section; header; footer; nav; aside; headings hierárquicos. Não utilize div para tudo.

============================================================
79. MENU DE NAVEGAÇÃO
============================================================
O menu deverá ser acessível; responsivo; fechável; navegável por teclado; sincronizado com as páginas. Quando possível destaque a seção/página atual.

============================================================
80. ESTADO DO LEITOR
============================================================
Centralize o estado: const readerState = { currentPage: 1, totalPages: 0, zoom: 1, theme: "dark", search: {}, tts: {} }; Adapte à implementação.

============================================================
81. CONTROLES DE TECLADO
============================================================
Quando apropriado: ArrowUp → página anterior; ArrowDown → página seguinte; PageUp → anterior; PageDown → seguinte; Home → início; End → fim; Ctrl/Cmd + F → pesquisa; Esc → fechar modal/interação. Não prejudique campos digitáveis.

============================================================
82. ACESSIBILIDADE
============================================================
Implemente headings corretos; contraste; foco; navegação por teclado; ARIA; labels; aria-expanded; aria-controls; aria-current; aria-label; leitor de tela; reduced motion.

============================================================
83. ACESSIBILIDADE COGNITIVA
============================================================
Priorize previsibilidade; consistência; controles claros; estados compreensíveis; pouca ambiguidade; navegação simples; baixa carga cognitiva.

============================================================
84. REDUCED MOTION
============================================================
Implemente @media (prefers-reduced-motion: reduce) { ... }. Reduza animações; transições; efeitos.

============================================================
85. MICROINTERAÇÕES
============================================================
Use hover; focus; active; reveal; feedback; transições suaves. Somente quando agregarem valor.

============================================================
86. PERFORMANCE
============================================================
Priorize DOM eficiente; poucos listeners; event delegation quando apropriado; CSS eficiente; JS modular; lazy loading; imagens otimizadas; baixo consumo de memória.

============================================================
87. NÃO DUPLICAR O DOM DESNECESSARIAMENTE
============================================================
Não gere múltiplas cópias completas do documento somente para busca; exportação; impressão; navegação. Quando possível derive essas funcionalidades da estrutura principal.

============================================================
88. EXPORTAÇÃO SEM PERDA DE CONTEÚDO
============================================================
PDF e EPUB deverão utilizar o conteúdo real do documento. Não resumir; cortar; remover capítulos; omitir tabelas; remover referências.

============================================================
89. EXPORTAÇÃO EPUB E ELEMENTOS INTERATIVOS
============================================================
Reconheça que determinados recursos HTML não são apropriados para EPUB. Na conversão transforme elementos interativos em equivalentes editoriais quando necessário: formulário → campos estáticos; botão interativo → texto equivalente; animação → composição estática; tooltip → nota; estado dinâmico → representação editorial. Preserve conteúdo e significado.

============================================================
90. EXPORTAÇÃO PDF E ELEMENTOS INTERATIVOS
============================================================
Na impressão: remover controles digitais; manter informação relevante; preservar links quando o navegador suportar; manter layout A4; manter paginação; manter identidade.

============================================================
91. CAPA
============================================================
Se o documento possuir capa: preserve-a. Se não possuir: não invente conteúdo factual para criar uma capa. A equipe poderá criar uma composição editorial com base no título e no próprio conteúdo, sem inventar informações externas.

============================================================
92. SUMÁRIO
============================================================
Quando houver títulos suficientes: crie um sumário navegável automaticamente. Cada item deverá apontar para a seção correta.

============================================================
93. PÁGINA ATUAL
============================================================
A interface poderá exibir Página 14 de 62 e/ou 14 / 62. Atualize automaticamente.

============================================================
94. PROGRESSO
============================================================
O progresso deverá representar a posição real do leitor. Não exiba um percentual arbitrário.

============================================================
95. PESQUISA E PAGINAÇÃO
============================================================
A pesquisa deve localizar o texto mesmo quando ele estiver distribuído em várias páginas. O resultado deve levar à página correspondente. Não destrua a estrutura para criar marcações temporárias.

============================================================
96. ESTILO DE LEITURA
============================================================
O resultado deve parecer editorial; sofisticado; organizado; tecnológico; profissional. Não precisa parecer uma landing page.

============================================================
97. DOCUMENTOS MUITO LONGOS
============================================================
Para documentos extensos: evite scripts que processem milhares de elementos repetidamente; utilize delegação; utilize processamento incremental quando apropriado; minimize reflows; carregue recursos conforme necessário.

============================================================
98. DOCUMENTOS MUITO CURTOS
============================================================
Não aumente artificialmente a quantidade de páginas. Se o documento for curto: use somente as páginas necessárias.

============================================================
99. TABELAS E DADOS ESTRUTURADOS
============================================================
Quando o documento possuir dados estruturados: preserve colunas; linhas; cabeçalhos; hierarquia. Em telas pequenas: utilize adaptação apropriada sem perda de informação.

============================================================
100. LISTAS
============================================================
Preserve listas ordenadas; listas não ordenadas; níveis de aninhamento.

============================================================
101. CITAÇÕES
============================================================
Citações presentes no documento deverão ser apresentadas visualmente como citações. Não transforme citação em simples parágrafo se isso destruir sua natureza.

============================================================
102. NOTAS E REFERÊNCIAS
============================================================
Preserve referências, notas e fontes existentes. Quando tecnicamente possível: crie navegação entre nota e referência. Não invente bibliografia.

============================================================
103. LINKS INTERNOS
============================================================
Quando a origem possuir links internos: preserve-os. Quando necessário converta referências de página para âncoras HTML correspondentes.

============================================================
104. LINKS EXTERNOS
============================================================
Preserve URLs existentes. Não invente destinos.

============================================================
105. SEGURANÇA
============================================================
Nunca execute código importado do documento simplesmente porque ele existe. O documento é uma fonte de conteúdo. Não uma fonte automática de execução.

============================================================
106. HTML IMPORTADO
============================================================
Quando a origem for HTML: preserve o conteúdo textual e semântico. Reaproveite somente a estrutura que fizer sentido. Sanitize scripts; eventos inline; recursos maliciosos; conteúdo executável. Não permita que CSS importado destrua a nova identidade visual.

============================================================
107. JSON IMPORTADO
============================================================
Se o JSON possuir { "titulo": "...", "capitulos": [...] } transforme semanticamente a estrutura. Quando houver arrays; objetos; chaves; valores; organize-os visualmente. Não mostre somente o JSON bruto, exceto quando o documento for explicitamente um material técnico sobre JSON e sua representação literal for parte essencial do conteúdo.

============================================================
108. MARKDOWN IMPORTADO
============================================================
Preserve semanticamente #; ##; ###; listas; tabelas; links; blockquotes; código.

============================================================
109. DOCX IMPORTADO
============================================================
Preserve a hierarquia documental sempre que detectável: Título → Heading 1 → Heading 2 → parágrafo → lista → tabela.

============================================================
110. PDF IMPORTADO
============================================================
Quando o PDF possuir estrutura visual importante: não confunda ordem física com ordem lógica. Analise colunas; blocos; cabeçalhos; rodapés; tabelas; caixas; seções.

============================================================
111. EPUB IMPORTADO
============================================================
Preserve a sequência definida pela publicação original. Não reorganize capítulos arbitrariamente.

============================================================
112. CONVERSÃO VISUAL
============================================================
Transforme elementos textuais em componentes visuais adequados. Exemplos: títulos → headings; informações importantes → callouts; listas → listas estilizadas; citações → quote cards; tabelas → tabelas premium; capítulos → páginas/seções editoriais; notas → notas editoriais. Não altere o conteúdo.

============================================================
113. DESIGN SEM EXCESSO
============================================================
Não transforme todo parágrafo em card. Não transforme todo título em gradiente. Não utilize dezenas de efeitos. Use ritmo.

============================================================
114. IDENTIDADE VISUAL + CONTEÚDO
============================================================
O design deverá refletir o conteúdo. Um documento jurídico, acadêmico, técnico, educacional, literário ou empresarial poderá possuir arquiteturas visuais distintas. Não aplique o mesmo estilo a todos.

============================================================
115. REFERÊNCIA VISUAL
============================================================
Se houver um HTML de referência junto ao arquivo: considere-o como PADRÃO DE EXPERIÊNCIA. Observe densidade; toolbar; páginas; controles; proporções; comportamento; responsividade; exportação. Mas recrie a solução para o conteúdo atual.

============================================================
116. REGRA DE CUSTOMIZAÇÃO
============================================================
Cada execução deverá produzir UM HTML ÚNICO E ADAPTADO AO DOCUMENTO RECEBIDO. Não utilize estrutura textual fixa. Não utilize títulos genéricos. Não reutilize uma identidade visual sem avaliar o conteúdo.

============================================================
117. AUDITORIA DE CONTEÚDO
============================================================
Antes de finalizar verifique: todo conteúdo foi incorporado; nenhum capítulo foi perdido; nenhum parágrafo importante foi omitido; listas preservadas; tabelas preservadas; links preservados; referências preservadas; títulos preservados; ordem preservada.

============================================================
118. AUDITORIA DE PAGINAÇÃO
============================================================
Verifique A4; 21 × 29,7 cm; 16 × 26 cm; conteúdo dentro da área; cabeçalho; rodapé; numeração; ausência de overflow; ausência de cortes; ausência de quebras inadequadas.

============================================================
119. AUDITORIA DE RESPONSIVIDADE
============================================================
Verifique 320px; 360px; 375px; 390px; 414px; 480px; 768px; 1024px; 1280px; 1440px; 1920px. E também portrait; landscape; telas de pouca altura.

============================================================
120. AUDITORIA DE INTERAÇÃO
============================================================
Verifique menu; pesquisa; Ouvir; pausa; parar; impressão; PDF; EPUB; voltar ao topo; página anterior; página seguinte; zoom; tema; progresso; localStorage.

============================================================
121. AUDITORIA DE ACESSIBILIDADE
============================================================
Verifique foco; teclado; aria; contraste; labels; leitor de tela; heading hierarchy; reduced motion; botões; menus; pesquisa; modais.

============================================================
122. AUDITORIA DE SEGURANÇA
============================================================
Verifique scripts importados removidos; eventos inline removidos quando perigosos; URLs javascript: eliminadas; conteúdo externo controlado; HTML sanitizado; nenhum XSS evidente; nenhuma execução não autorizada.

============================================================
123. AUDITORIA DE PERFORMANCE
============================================================
Verifique DOM; CSS; JavaScript; listeners; assets; memória; reflow; repaint; carregamento.

============================================================
124. AUDITORIA DO EPUB
============================================================
Verifique mimetype; container; OPF; nav; manifest; spine; XHTML; CSS; links; imagens; metadata; capa.

============================================================
125. AUDITORIA DO PDF
============================================================
Simule Ctrl + P → A4 → escala adequada → salvar PDF. Confirme páginas; área 16 × 26; numeração; cabeçalho; rodapé; imagens; tabelas; texto.

============================================================
126. AUDITORIA DE CROSS-BROWSER
============================================================
Considere Chrome; Edge; Firefox; Safari. Evite recursos que dependam de comportamento exclusivo de um navegador quando houver alternativa.

============================================================
127. REGRA SOBRE FEATURES
============================================================
Não implemente funções somente porque estão na lista. Implemente-as quando fizerem sentido e quando puderem funcionar corretamente. Porém, nesta especificação são obrigatórios, salvo impossibilidade técnica real: pesquisa; Ouvir; Imprimir; Exportar PDF; Exportar EPUB; voltar ao topo; página anterior; página seguinte; menu de navegação; progresso; responsividade; modo claro/escuro.

============================================================
128. REGRA DE TRANSPARÊNCIA TÉCNICA
============================================================
Não simule que uma funcionalidade está funcionando quando não estiver. Se determinada capacidade depender de suporte do navegador: implemente fallback amigável. Não crie falsa confirmação.

============================================================
129. REGRA DE AUSÊNCIA DE BACKEND
============================================================
O HTML deverá funcionar sem servidor próprio; PHP; Node; banco; API obrigatória; compilação.

============================================================
130. COMPATIBILIDADE COM GITHUB PAGES
============================================================
O resultado deverá funcionar em index.html publicado em GitHub Pages.

============================================================
131. NÃO CRIAR ARQUIVOS EXTERNOS OBRIGATÓRIOS
============================================================
Não entregue CSS separado; JS separado; HTML separado; componentes obrigatórios. O único arquivo obrigatório será index.html.

============================================================
132. ORGANIZAÇÃO DO CÓDIGO
============================================================
Organize o código internamente em blocos claros: META; TOKENS; RESET; LAYOUT; TOOLBAR; SEARCH; READER; PAGES; TYPOGRAPHY; COMPONENTS; NAVIGATION; THEMES; RESPONSIVE; PRINT; EPUB; ACCESSIBILITY; JAVASCRIPT.

============================================================
133. COMENTÁRIOS DE CÓDIGO
============================================================
Comentários podem ser usados para explicar seções; facilitar manutenção; identificar componentes; explicar decisões técnicas importantes. Não crie comentários excessivamente longos.

============================================================
134. SE O DOCUMENTO POSSUIR FORMULÁRIOS
============================================================
Preserve sua função quando possível. Ajuste apenas responsividade; acessibilidade; layout. Não envie dados para servidores sem integração existente.

============================================================
135. SE O DOCUMENTO POSSUIR CÓDIGO
============================================================
Se o conteúdo textual do documento incluir exemplos de código: preserve-os como conteúdo textual. Utilize <pre><code>...</code></pre>. Não execute código do documento.

============================================================
136. SE O DOCUMENTO POSSUIR URLS
============================================================
Preserve-as corretamente. Não invente URLs.

============================================================
137. SE O DOCUMENTO POSSUIR EQUAÇÕES
============================================================
Preserve a legibilidade. Utilize HTML/CSS ou MathML quando apropriado. Não converta fórmulas em texto ilegível.

============================================================
138. SE O DOCUMENTO POSSUIR TABELAS COMPLEXAS
============================================================
Preserve toda a informação. Quando a tabela exceder a largura útil: aplique estratégia apropriada para impressão; desktop; mobile.

============================================================
139. SE O DOCUMENTO POSSUIR MUITOS CAPÍTULOS
============================================================
O menu deverá lidar com grande quantidade de itens. Considere scroll interno; agrupamento; pesquisa no índice; destaque da seção atual.

============================================================
140. SE O DOCUMENTO FOR ACADÊMICO
============================================================
Preserve títulos; subseções; citações; notas; referências; tabelas; figuras; numeração. Não transforme um documento acadêmico em uma página promocional.

============================================================
141. SE O DOCUMENTO FOR EMPRESARIAL
============================================================
Preserve seções; tabelas; indicadores; listas; informações institucionais. Adapte o design ao contexto.

============================================================
142. SE O DOCUMENTO FOR LITERÁRIO
============================================================
Preserve ritmo; capítulos; epígrafes; citações; separações; hierarquia textual. O design deve respeitar a natureza literária.

============================================================
143. SE O DOCUMENTO FOR TÉCNICO
============================================================
Preserve código; tabelas; diagramas descritos; instruções; notas; referências. Priorize legibilidade.

============================================================
144. SE O DOCUMENTO FOR EDUCACIONAL
============================================================
Preserve atividades; perguntas; exercícios; tabelas; conceitos; destaques. Pode acrescentar interações que apoiem a leitura, sem alterar o conteúdo original.

============================================================
145. REGRA DE UNIVERSALIDADE
============================================================
Este prompt deverá ser executável sem necessidade de reescrita para cada formato. A equipe deverá: IDENTIFICAR O FORMATO → INTERPRETAR A ESTRUTURA → PRESERVAR O CONTEÚDO → NORMALIZAR A SEMÂNTICA → DEFINIR A ARQUITETURA → CRIAR A IDENTIDADE VISUAL → PAGINAR → IMPLEMENTAR INTERAÇÕES → IMPLEMENTAR RESPONSIVIDADE → IMPLEMENTAR IMPRESSÃO → IMPLEMENTAR PDF → IMPLEMENTAR EPUB → AUDITAR → ENTREGAR.

============================================================
146. REGRA DE NÃO REDESIGN DE CONTEÚDO
============================================================
Quando o documento já possuir uma estrutura forte: preserve-a. Não reorganize simplesmente porque outra ordem parece mais bonita.

============================================================
147. REGRA DE MELHORIA VISUAL
============================================================
Você pode melhorar hierarquia; espaçamento; componentes; tipografia; navegação; representação das seções; leitura. Mas não altere o conteúdo para fazê-lo "caber melhor".

============================================================
148. REGRA DE PAGINAÇÃO AUTOMÁTICA INTELIGENTE
============================================================
Quando possível implemente uma etapa de validação que verifique páginas com conteúdo acima da altura permitida. Conceitualmente: if (content.scrollHeight > content.clientHeight) { // redistribuir blocos }. A implementação real deverá ser muito mais cuidadosa. Priorize divisão por: bloco; parágrafo; lista; tabela; unidade semanticamente coerente. Nunca corte texto arbitrariamente no meio.

============================================================
149. REGRA CONTRA RESPONSIVIDADE DESTRUTIVA
============================================================
Nunca resolva um problema mobile destruindo a geometria editorial. Evite página A4 deformada; largura cheia quando a geometria exige escala; conteúdo comprimido; fonte ilegível; toolbar gigante; overflow escondido.

============================================================
150. REGRA DE MANUTENIBILIDADE
============================================================
O código deverá ser fácil de manter. Centralize configurações; títulos; páginas; estado; tema; assets; navegação; metadados.

============================================================
151. REGRA DE IDENTIDADE DOS COMPONENTES
============================================================
Crie componentes consistentes para página; toolbar; botão; heading; callout; quote; tabela; lista; figura; navegação; menu; modal; toast; progresso.

============================================================
152. REGRA DE EXPERIÊNCIA DIGITAL
============================================================
O resultado deverá parecer UM DOCUMENTO DIGITAL PREMIUM. Não: UM TEXTO DENTRO DE UMA PÁGINA WEB. O leitor deve perceber organização; cuidado; tecnologia; fluidez; qualidade; previsibilidade; profissionalismo.

============================================================
153. REGRA DE EXPERIÊNCIA MOBILE
============================================================
No celular o leitor deverá conseguir abrir; pesquisar; ouvir; navegar; aumentar/diminuir zoom; mudar tema; avançar página; voltar página; voltar ao topo; imprimir/exportar quando suportado.

============================================================
154. REGRA DE EXPERIÊNCIA DESKTOP
============================================================
No desktop: páginas A4 centralizadas; toolbar acessível; menu claro; leitura confortável; controles discretos; navegação eficiente.

============================================================
155. REGRA DE EXPERIÊNCIA TABLET
============================================================
No tablet: escala proporcional; controles acessíveis; navegação simplificada; páginas preservadas.

============================================================
156. REGRA DE QUALIDADE FINAL
============================================================
Antes da entrega faça internamente uma auditoria em cinco dimensões: CONTEÚDO (tudo preservado?), EDITORIAL (tudo bem organizado?), VISUAL (identidade coerente?), FUNCIONAL (todos os controles funcionam?), TÉCNICO (responsividade, impressão, PDF, EPUB, segurança e performance adequados?).

============================================================
157. CHECKLIST FINAL DE FUNCIONALIDADE
============================================================
Confirme abrir documento; navegar; menu; pesquisa; destaque de pesquisa; Ouvir; pausar; continuar; parar; imprimir; PDF; EPUB; voltar ao topo; página anterior; página seguinte; progresso; tema claro; tema escuro; zoom; localStorage; mobile; tablet; desktop.

============================================================
158. CHECKLIST FINAL DE PAGINAÇÃO
============================================================
Confirme A4; 21 × 29,7 cm; área 16 × 26 cm; conteúdo dentro do campo; nenhuma página com overflow; cabeçalho; rodapé; paginação; impressão correta.

============================================================
159. CHECKLIST FINAL DE RESPONSIVIDADE
============================================================
Confirme 320px; 360px; 375px; 390px; 414px; 480px; 768px; 1024px; 1280px; 1440px; 1920px; portrait; landscape; pouca altura; zero overflow horizontal.

============================================================
160. CHECKLIST FINAL DE ACESSIBILIDADE
============================================================
Confirme teclado; foco; contraste; labels; ARIA; headings; leitura assistiva; reduced motion; botões; pesquisa; navegação.

============================================================
161. CHECKLIST FINAL DE SEGURANÇA
============================================================
Confirme scripts externos controlados; código importado não executado indevidamente; HTML sanitizado; URLs seguras; ausência de XSS evidente; conteúdo externo minimizado.
